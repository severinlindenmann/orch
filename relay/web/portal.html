document.body.classList.remove('menu-open');$('#menu').setAttribute('aria-expanded','false');
 const key=screens.some(([k])=>k===location.hash.slice(1))?location.hash.slice(1):'overview',title=screens.find(([k])=>k===key)[1];
 document.title='orch relay · '+title;$('#crumb').textContent=title;for(const a of $('#nav').children){a.classList.toggle('active',a.hash==='#'+key);if(a.hash==='#'+key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')}
 if(!token){auth();return}document.body.classList.remove('signedout');const v=++epoch;
 $('#top-add').hidden=key!=='overview';document.querySelectorAll('dialog[open]').forEach(d=>orch.close(d));const changed=lastRoute!==null&&lastRoute!==key;lastRoute=key;
 const slow=loadingTimer=setTimeout(()=>{if(v===epoch)app.replaceChildren(skeleton())},300);
 try{const ws=await all('/workspaces');if(v!==epoch)return;workspaces=ws;phoneList=await all('/phones');if(v!==epoch)return;await ({overview,add,rules,messages,config,webhooks,phones}[key])(v);if(v===epoch){touched();if(changed)orch.enter(app)}}catch(e){if(v!==epoch||!token)return;show(panel('This page could not be loaded',empty('Could not load this page',e.message,button('Try again',()=>route()))))}finally{clearTimeout(slow)}
}
for(const [key,title,hidden]of screens)if(!hidden)$('#nav').append(el('a',{href:'#'+key,class:'nav-item'},uiIcon(key),title));
$('#menu').addEventListener('click',()=>{const o=document.body.classList.toggle('menu-open');$('#menu').setAttribute('aria-expanded',String(o))});
document.addEventListener('click',e=>{document.querySelectorAll('.more-menu').forEach(menu=>{if(!menu.contains(e.target)){menu.querySelector('.menu-items').hidden=true;menu.querySelector('button').setAttribute('aria-expanded','false')}})});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;document.querySelectorAll('.more-menu [aria-expanded=true]').forEach(b=>{b.setAttribute('aria-expanded','false');b.parentElement.querySelector('.menu-items').hidden=true;b.focus()});if(document.body.classList.contains('menu-open')){document.body.classList.remove('menu-open');$('#menu').setAttribute('aria-expanded','false');$('#menu').focus()}});
window.addEventListener('hashchange',()=>{clearToast();route()});route();
</script>
</body></html>
