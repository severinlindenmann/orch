[project]
name = "orch-hello-world"
version = "0.1.0"
description = "e2e fixture add-on: a command, a skill and a dashboard tab"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."orch.addons"]
hello-world = "orch_hello"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_hello"]

[tool.hatch.build]
ignore-vcs = true  # e2e copies this folder under an ignored temp folder; hatch would otherwise drop every file
