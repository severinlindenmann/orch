[project]
name = "orch-needs-addon"
version = "0.1.0"
description = "e2e fixture add-on: rows for orch needs"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."orch.addons"]
needs-addon = "orch_needs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_needs"]

[tool.hatch.build]
ignore-vcs = true  # e2e copies this folder under an ignored temp folder; hatch would otherwise drop every file
