# workspace-addons/scheduler/src/orch_scheduler/orch-addon.toml (inside the Python package, next to __init__.py)
schema = "orch.addon/1"
orch_api = 1
name = "scheduler"
version = "0.2.0"
description = "Starts agent runs at a set time, on a repeat, and when the phone or another workspace sends work."
run = "orch_scheduler"                     # orch scheduler <args>  ->  python -m orch_scheduler <args>
skill = "skills/orch-scheduler"
agents_block = "skills/orch-scheduler/AGENTS-block.md"
ticket_ext = "ext.schema.json"             # byte-identical copy of contracts/addons/scheduler.ext.schema.json
needs = true                               # orch scheduler needs --json
background = true                          # has `orch scheduler start|stop`

[dashboard]
label = "Schedule"
icon = "clock"
order = 10

[[ticket_view]]
field = "cron"
label = "Repeats"
format = "cron-human"

[[ticket_view]]
field = "agent"
label = "Runs with"
format = "text"

[[ticket_view]]
field = "last_run"
label = "Last run"
format = "time"
