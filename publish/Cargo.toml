[package]
name = "orch-publish"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "orch_publish"
path = "src/lib.rs"

[[bin]]
name = "orch-publish"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "time", "fs", "io-util", "sync"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
tar = "0.4"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = "0.3"
subtle = "2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
aes-gcm = "0.10"
tempfile = "3"
