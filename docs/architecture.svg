<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>orch architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3ad"/></marker>
  </defs>
  <rect width="1200" height="760" rx="14" fill="#0e1014"/>
  <!-- laptop -->
  <rect x="30" y="60" width="340" height="540" rx="12" fill="#15181d" stroke="#2fc6a3" stroke-width="1.5"/>
  <text x="50" y="92" fill="#2fc6a3" font-size="17" font-weight="700">Laptop / customer PC</text>
  <text x="50" y="112" fill="#9aa3ad" font-size="12.5">your project folder</text>
  <rect x="50" y="130" width="300" height="62" rx="8" fill="#1c2027" stroke="#2a3038"/>
  <text x="200" y="154" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">Your agent, any tool</text>
  <text x="200" y="176" fill="#9aa3ad" font-size="12.5" text-anchor="middle">Claude Code · Codex · Copilot · Cowork</text>
  <rect x="50" y="216" width="300" height="62" rx="8" fill="#0f2a25" stroke="#2fc6a3"/>
  <text x="200" y="241" fill="#2fc6a3" font-size="14" font-weight="700" text-anchor="middle">orch CLI + skills</text>
  <text x="200" y="262" fill="#9aa3ad" font-size="12.5" text-anchor="middle">tickets, checklists, questions</text>
  <rect x="50" y="302" width="300" height="52" rx="8" fill="#1c2027" stroke="#2a3038"/>
  <text x="200" y="324" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">.orch/  (plain files)</text>
  <text x="200" y="343" fill="#9aa3ad" font-size="12.5" text-anchor="middle">tickets · inbox · no server needed</text>
  <rect x="50" y="378" width="145" height="74" rx="8" fill="#2a1a0e" stroke="#f07a2e"/>
  <text x="122" y="404" fill="#f07a2e" font-size="14" font-weight="700" text-anchor="middle">Dashboard</text>
  <text x="122" y="424" fill="#9aa3ad" font-size="12" text-anchor="middle">on localhost</text>
  <text x="122" y="440" fill="#9aa3ad" font-size="12" text-anchor="middle">(add-on)</text>
  <rect x="205" y="378" width="145" height="74" rx="8" fill="#2a1a0e" stroke="#f07a2e"/>
  <text x="277" y="404" fill="#f07a2e" font-size="14" font-weight="700" text-anchor="middle">Scheduler</text>
  <text x="277" y="424" fill="#9aa3ad" font-size="12" text-anchor="middle">wakes the agent</text>
  <text x="277" y="440" fill="#9aa3ad" font-size="12" text-anchor="middle">(add-on)</text>
  <g stroke="#9aa3ad" stroke-width="1.5" marker-end="url(#a)"><path d="M200 192V214"/><path d="M200 278V300"/><path d="M122 354V376"/><path d="M277 354V376"/></g>
  <text x="200" y="500" fill="#e8eaed" font-size="13" font-weight="600" text-anchor="middle">Workspaces only connect outward.</text>
  <text x="200" y="520" fill="#9aa3ad" font-size="12.5" text-anchor="middle">Nothing connects in to your machine.</text>
  <text x="200" y="560" fill="#9aa3ad" font-size="12" text-anchor="middle">Works alone, even offline.</text>
  <!-- VPS -->
  <rect x="470" y="60" width="400" height="540" rx="12" fill="#15181d" stroke="#2a3038" stroke-width="1.5"/>
  <text x="490" y="92" fill="#e8eaed" font-size="17" font-weight="700">Your VPS</text>
  <text x="490" y="112" fill="#9aa3ad" font-size="12.5">one small server, HTTPS in front</text>
  <rect x="490" y="130" width="360" height="150" rx="10" fill="#0f1b2b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="508" y="158" fill="#60a5fa" font-size="16" font-weight="700">publish</text>
  <text x="508" y="177" fill="#9aa3ad" font-size="12.5">publish.severin.io</text>
  <text x="508" y="205" fill="#e8eaed" font-size="13">Encrypted file links  /f/</text>
  <text x="508" y="228" fill="#e8eaed" font-size="13">Small apps  /a/</text>
  <text x="508" y="251" fill="#e8eaed" font-size="13">Workspace API</text>
  <rect x="490" y="310" width="360" height="270" rx="10" fill="#1b1528" stroke="#b392f0" stroke-width="1.5"/>
  <text x="508" y="338" fill="#b392f0" font-size="16" font-weight="700">relay</text>
  <text x="508" y="357" fill="#9aa3ad" font-size="12.5">relay.severin.io</text>
  <text x="508" y="385" fill="#e8eaed" font-size="13">Inbox and rules</text>
  <text x="508" y="408" fill="#e8eaed" font-size="13">Webhooks</text>
  <text x="508" y="431" fill="#e8eaed" font-size="13">Shared tools (skills, MCP, credentials)</text>
  <text x="508" y="454" fill="#e8eaed" font-size="13">Phone API</text>
  <text x="508" y="477" fill="#e8eaed" font-size="13">Voice to text</text>
  <text x="508" y="500" fill="#e8eaed" font-size="13">Push notifications</text>
  <text x="508" y="540" fill="#9aa3ad" font-size="12">Stored encrypted at rest.</text>
  <text x="508" y="558" fill="#9aa3ad" font-size="12">The admin can read messages.</text>
  <!-- right column -->
  <rect x="960" y="130" width="210" height="64" rx="10" fill="#1c2027" stroke="#60a5fa"/>
  <text x="1065" y="158" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">Browser</text>
  <text x="1065" y="178" fill="#9aa3ad" font-size="12" text-anchor="middle">opens a link, decrypts locally</text>
  <rect x="960" y="318" width="210" height="64" rx="10" fill="#1c2027" stroke="#b392f0"/>
  <text x="1065" y="346" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">Other workspaces</text>
  <text x="1065" y="366" fill="#9aa3ad" font-size="12" text-anchor="middle">colleagues, other machines</text>
  <rect x="960" y="402" width="210" height="64" rx="10" fill="#1c2027" stroke="#b392f0"/>
  <text x="1065" y="430" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">iPhone app</text>
  <text x="1065" y="450" fill="#9aa3ad" font-size="12" text-anchor="middle">answer, send text or voice</text>
  <rect x="960" y="498" width="210" height="44" rx="10" fill="#0e1014" stroke="#9aa3ad" stroke-dasharray="5 4"/>
  <text x="1065" y="525" fill="#e8eaed" font-size="13" text-anchor="middle">Deepgram (voice)</text>
  <rect x="960" y="556" width="210" height="44" rx="10" fill="#0e1014" stroke="#9aa3ad" stroke-dasharray="5 4"/>
  <text x="1065" y="583" fill="#e8eaed" font-size="13" text-anchor="middle">Apple push</text>
  <!-- arrows -->
  <path d="M350 235H420V205H488" fill="none" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M350 235H420V440H488" fill="none" stroke="#b392f0" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="412" y="300" fill="#9aa3ad" font-size="10.5" text-anchor="end">HTTPS,</text><text x="412" y="314" fill="#9aa3ad" font-size="10.5" text-anchor="end">outward</text>
  <path d="M960 162H852" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M960 350H852" stroke="#b392f0" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M960 434H852" stroke="#b392f0" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M852 520H958" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M852 578H958" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <!-- admin -->
  <rect x="30" y="650" width="1140" height="80" rx="12" fill="#15181d" stroke="#2fc6a3" stroke-dasharray="7 5" stroke-width="1.5"/>
  <text x="50" y="682" fill="#2fc6a3" font-size="15" font-weight="700">Admin portals, private network only</text>
  <text x="50" y="706" fill="#9aa3ad" font-size="13">The publish and relay admin pages are never public. The admin reaches them from their own devices on the private network, with an admin token.</text>
  <path d="M670 600V648" stroke="#2fc6a3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
