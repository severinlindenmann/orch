name: edge-job-home
description: >-
  On the orch edge test server's own runner (ORCH-1126): give the job the runner user's own home as a throwaway
  home (runner-loop.sh makes it fresh before every job), an orch home inside it with ORCH_HOME_STRICT=1, the download caches inside it
  too (uv, Python, Rust, browsers, npm: no job leaves a program for the next one, security review ORCH-1233 L2) and
  a cap on test workers so 8 GB of memory holds. On GitHub's machines it does nothing.
runs:
  using: composite
  steps:
    - name: Throwaway home (orch edge runner only)
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -eu
        # The runner user's real home itself (account database), as on GitHub's machines: orch trusts an ORCH_HOME
        # only under it, and a test workspace only under its .orch-test, where the e2e and Services runs put theirs
        # ($HOME/.orch-test). runner-loop.sh makes that home fresh before every job.
        h=$(getent passwd "$(id -u)" | cut -d: -f6)
        mkdir -p "$h/orch" "$h/.config" "$h/.cache" "$RUNNER_TEMP/tmp"
        cache="$h/.cache"   # downloads and toolchains of this job only (Rust comes from dtolnay/rust-toolchain)
        mkdir -p "$cache/uv" "$cache/uv-python" "$cache/ms-playwright" "$cache/npm" "$cache/cargo" "$cache/rustup"
        {
          echo "HOME=$h"
          echo "XDG_CONFIG_HOME=$h/.config"
          echo "XDG_CACHE_HOME=$h/.cache"
          echo "ORCH_HOME=$h/orch"
          echo "ORCH_HOME_STRICT=1"
          # Debian 13 keeps /tmp in memory (half of it): a cargo build or a test's temp files there fill it and take
          # the memory the tests need. The job's temp folder is on disk and wiped after the job.
          echo "TMPDIR=$RUNNER_TEMP/tmp"
          echo "UV_CACHE_DIR=$cache/uv"
          echo "UV_PYTHON_INSTALL_DIR=$cache/uv-python"
          # Clock tests (scripts/at-clock.sh): only the wall clock moves, file times stay real, as on GitHub's machines.
          # On this machine libfaketime would also shift the file times a program reads but never the ones it sets,
          # so a file made "an hour ago" would look 9 hours old; NO_FAKE_STAT turns that off. And uv's own Python
          # builds, not Debian's, so every job runs on the same Python whatever this machine has installed.
          echo "NO_FAKE_STAT=1"
          echo "UV_PYTHON_PREFERENCE=only-managed"
          echo "PLAYWRIGHT_BROWSERS_PATH=$cache/ms-playwright"
          echo "npm_config_cache=$cache/npm"
          echo "CARGO_HOME=$cache/cargo"
          echo "RUSTUP_HOME=$cache/rustup"
          # 8 cores / 8 GB, shared with the test copies of relay, publish and hub: half the cores for tests and builds
          echo "PYTEST_XDIST_AUTO_NUM_WORKERS=4"
          echo "CARGO_BUILD_JOBS=4"
          echo "ORCH_EDGE_RUNNER=1"
        } >> "$GITHUB_ENV"
        echo "$cache/cargo/bin" >> "$GITHUB_PATH"
        echo "Throwaway home: $h"
