name: mac-job-home
description: >-
  On this Mac's own runner (ORCH-1125): give the job a throwaway home under the job's temp folder (the runner wipes
  it after the job), an orch home inside it with ORCH_HOME_STRICT=1, and download caches that survive between jobs.
  On GitHub's machines it does nothing.
runs:
  using: composite
  steps:
    - name: Throwaway home (this Mac's runner only)
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -eu
        real_home=$HOME
        h="$RUNNER_TEMP/home"
        mkdir -p "$h/orch" "$h/.config" "$h/Library/Caches"
        cache="$real_home/ci-cache"   # downloads only (uv, Python, browsers): content-addressed, safe to share
        mkdir -p "$cache/uv" "$cache/uv-python" "$cache/ms-playwright" "$cache/npm"
        {
          echo "HOME=$h"
          echo "USERPROFILE=$h"
          echo "XDG_CONFIG_HOME=$h/.config"
          echo "XDG_CACHE_HOME=$h/Library/Caches"
          echo "ORCH_HOME=$h/orch"
          echo "ORCH_HOME_STRICT=1"
          echo "UV_CACHE_DIR=$cache/uv"
          echo "UV_PYTHON_INSTALL_DIR=$cache/uv-python"
          echo "PLAYWRIGHT_BROWSERS_PATH=$cache/ms-playwright"
          echo "npm_config_cache=$cache/npm"
          echo "ORCH_MAC_RUNNER=1"
        } >> "$GITHUB_ENV"
        echo "Throwaway home: $h"
