name: publish
on:
  workflow_call:
    inputs:
      runs_on:
        description: "where it runs, as a JSON list of runs-on values, one leg each: [\"ubuntu-latest\"], or the orch edge runner's labels, or both on a release pull request (ci.yml job route, ORCH-1126)"
        type: string
        default: '["ubuntu-latest"]'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(inputs.runs_on) }}
    name: test${{ matrix.machine != 'ubuntu-latest' && ' (orch edge)' || '' }}
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 20  # ~1.5 min with a warm cache; room for a cold cargo build
    defaults:
      run:
        working-directory: publish
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/edge-job-home
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: publish
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: node --test web/file.test.js
      # the release binary only after a merge (push) or on a manual run; PRs run cargo test only
      - run: cargo build --release
        if: github.event_name != 'pull_request'
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: orch-publish-linux-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: publish/target/release/orch-publish
