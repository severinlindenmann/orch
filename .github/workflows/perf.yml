name: perf
# orch at 10,000 tickets (ORCH-518, ORCH-525): a throwaway workspace seeded with 10,000 realistic tickets
# (e2e/perf/seed.py), then e2e/perf/check_limits.py measures `orch ticket list`, `orch needs`, every dashboard page and
# an idle minute on Home, and fails when one is slower or costlier than the owner's limit (e2e/perf/limits.json:
# commands under 1 s, pages usable under 2 s, an idle Home minute under 200 KB). The table goes in the job summary.
# Nightly and by hand on develop: the owner's limits decide, and the numbers are kept as develop's (artifact perf-10000).
# Merge queue groups that touch orch call it from ci.yml with against_develop (ORCH-1609, R8.3): there the limits are
# only shown, and it fails only when a row is more than 30% slower than develop's newest numbers
# (check_limits.py --against). No develop numbers yet: it passes and says so. develop's times are first rewritten for
# this runner's speed (scripts/perf_calibrate.py, ORCH-2399), so a slow runner is not a slow orch.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_call:
    inputs:
      against_develop:
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
  actions: read  # against_develop: reads develop's numbers from its newest perf run
jobs:
  limits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # orch's per-machine folder and the workspace live under ~/.orch-test, never a real ~/.orch-tool: orch trusts a
      # test home and a test workspace only there (orch/home.py)
      - name: Isolate orch's home
        run: |
          mkdir -p -m 700 "$HOME/.orch-test"
          echo "PERF_BASE=$HOME/.orch-test/perf" >> "$GITHUB_ENV"
          echo "ORCH_HOME=$HOME/.orch-test/orch-home" >> "$GITHUB_ENV"
          echo "ORCH_HOME_STRICT=1" >> "$GITHUB_ENV"
          echo "ORCH_NO_PULL_LOOK=1" >> "$GITHUB_ENV"
          echo "ORCH_NO_HEALTH_CHECK=1" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.orch-test/orch-home"
      - name: Install orch from this checkout
        env:
          ORCH_REPO: ${{ github.workspace }}
          ORCH_INSTALL_KIND: test
        run: |
          sh install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Playwright and Chromium for the page times
        run: |
          npm install --silent --prefix "$RUNNER_TEMP/pw" playwright@1.64.1
          (cd "$RUNNER_TEMP/pw" && npx playwright install --with-deps chromium)
          echo "PW_DIR=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: develop's numbers (its newest finished perf run)
        if: inputs.against_develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/perf-develop"
          echo "AGAINST=$dir/limits.json" >> "$GITHUB_ENV"
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow perf.yml --branch develop --status completed \
              --limit 10 --json databaseId -q '.[].databaseId'); do
            rm -rf "$dir"
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n perf-10000 -D "$dir" && [ -s "$dir/limits.json" ]; then
              echo "develop's numbers: perf run $id"
              exit 0
            fi
          done
          echo "No finished perf run on develop with numbers: nothing to compare with."
      # ORCH-2399: GitHub's machines differ up to 2x in speed, and a slow one failed every page against develop.
      # A fixed piece of work says how fast this runner is; it is kept with the numbers (the artifact), and
      # develop's times are rewritten for this runner before the comparison (only for a slower runner, at most 3x).
      - name: This runner's speed
        run: |
          python3 scripts/perf_calibrate.py measure "$PERF_BASE/out/calibration.json"
          if [ -n "${AGAINST:-}" ]; then python3 scripts/perf_calibrate.py scale "$AGAINST" "$PERF_BASE/out/calibration.json"; fi
      - name: Seed 10,000 tickets and check the limits
        timeout-minutes: 20
        run: python3 e2e/perf/check_limits.py "$PERF_BASE" ${AGAINST:+--against "$AGAINST"}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-10000
          path: ${{ env.PERF_BASE }}/out
          retention-days: 14
          if-no-files-found: ignore
