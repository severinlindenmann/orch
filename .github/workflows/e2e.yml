name: e2e
# Manual or nightly, never on a PR. Local mode: publish + relay are built and started on localhost.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "scenario id, comma list, group letter (W A P R M F) or all"
        default: all
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            publish
            relay
      # the browser lanes (LOOK-2, LOOK-5, P10, R18: dashboard, admin and shared-link pages like a person) need
      # Playwright; without it they are skipped (ORCH-895)
      - run: npm install -g playwright@1.64.1
      - run: playwright install --with-deps chromium
      - run: PW_DIR="$(npm root -g)" e2e/run.sh "${{ inputs.scenario || 'all' }}" --mode local
