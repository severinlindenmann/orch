name: e2e
# Manual or nightly, never on a PR. Local mode: publish + relay are built and started on localhost.
# When GitHub drops the nightly, a push to develop starts it as "e2e (catch-up)" (scripts/ci_catch_up.py, #2657).
run-name: ${{ inputs.catch_up && 'e2e (catch-up)' || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "scenario id, comma list, group letter (W A P R M F) or all"
        default: all
      catch_up:
        description: "started by scripts/ci_catch_up.py for a nightly GitHub dropped (read like the nightly)"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
jobs:
  # Where it runs: GitHub's machines, or the orch edge test server when the repository variable EDGE_RUNNER is
  # orch-edge-long or orch-edge (the long runs that wait for nobody; scripts/edge_route.py, ORCH-1126). Offline or
  # any problem: GitHub's machines.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      machine: ${{ steps.e.outputs.edge || '["ubuntu-latest"]' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/mac_route.py
            scripts/edge_route.py
          sparse-checkout-cone-mode: false
      - id: e
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          EDGE_RUNNER: ${{ vars.EDGE_RUNNER }}
          STATUS_TOKEN: ${{ secrets.MAC_RUNNER_STATUS_TOKEN }}
        run: python3 scripts/edge_route.py
  e2e:
    needs: route
    # a failed route (checkout, timeout) never skips the run: GitHub's machines
    if: ${{ !cancelled() }}
    # The full run is two jobs (ORCH-2399): one job with every scenario no longer fits the 60 minutes (release 52:
    # A24 alone took 1325 s and run 46079037055 was cut with no scenario red). 1/2 is `rest`, 2/2 is `long` (the
    # scenarios that take minutes each, e2e/parts.py); together they are exactly `all`. A named scenario is one job.
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON((inputs.scenario || 'all') == 'all' && '["1/2", "2/2"]' || '["1/1"]') }}
    runs-on: ${{ fromJSON(needs.route.outputs.machine || '["ubuntu-latest"]')[0] }}
    timeout-minutes: 60  # about 2.5x slower on orch edge than on GitHub's machines
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/edge-job-home
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            publish
            relay
      # the browser lanes (LOOK-2, LOOK-5, P10, R18: dashboard, admin and shared-link pages like a person) need
      # Playwright; without it they are skipped (ORCH-895)
      # orch edge: no sudo, so npm's global folder in the throwaway home and Chromium's system libraries come from
      # setup.sh (installed once)
      - run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            echo "NPM_CONFIG_PREFIX=$HOME/.npm-global" >> "$GITHUB_ENV"; echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          fi
      - run: npm install -g playwright@1.64.1
      - run: playwright install $([ "$RUNNER_ENVIRONMENT" = self-hosted ] || echo --with-deps) chromium
      - env:
          WHAT: ${{ (inputs.scenario || 'all') != 'all' && inputs.scenario || (matrix.part == '2/2' && 'long' || 'rest') }}
        run: PW_DIR="$(npm root -g)" e2e/run.sh "$WHAT" --mode local
