name: ci
on:
  pull_request:
    # draft PRs get no CI run (the gate says "draft"); marking the PR ready starts it
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      windows:
        description: "also run the Windows jobs (off by default: Windows is tested locally on the winvm VMs)"
        type: boolean
        default: false
  push:
    branches: [develop, main]
  # Nightly on develop (the default branch): the mobile suite with UI tests, even when no push ran it to the end.
  schedule:
    - cron: "0 1 * * *"
# one run per PR: a new push cancels the PR's older run. Pushes to develop/main: one group per branch, a newer push
# cancels the older run, so only the newest commit is tested and the queue stays short (15 Nov: 24 queued runs). A
# cancelled push run may have been the one that would have run the mobile UI tests; the nightly schedule run covers
# that (it runs mobile in full). Schedule and manual runs keep their own group and are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && format('push-{0}', github.ref)) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.f.outputs.contracts }}
      workspace: ${{ steps.f.outputs.workspace }}
      addons: ${{ steps.f.outputs.addons }}
      publish: ${{ steps.f.outputs.publish }}
      relay: ${{ steps.f.outputs.relay }}
      mobile: ${{ steps.f.outputs.mobile }}
      brand: ${{ steps.f.outputs.brand }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            contracts: ['contracts/**', '.github/workflows/contracts.yml']
            workspace: ['workspace/**', 'workspace-addons/*/src/**', 'contracts/**', 'install.ps1', 'install.sh', 'e2e/windows/**', '.github/workflows/workspace.yml']
            addons: ['workspace-addons/**', 'workspace/**', 'contracts/**', 'e2e/focus_insights*', '.github/workflows/addons.yml']
            publish: ['publish/**', 'contracts/**', 'workspace/src/orch_ui/static/tokens.css', 'workspace/src/orch/templates/**', '.github/workflows/publish.yml']
            relay: ['relay/**', 'contracts/**', 'workspace/src/orch_ui/static/tokens.css', '.github/workflows/relay.yml']
            # only the contracts the phone tests read (blocks, crypto, look, relay-api, message, chat-groups, vectors, examples, review)
            mobile: ['mobile/**', 'contracts/blocks*', 'contracts/crypto.md', 'contracts/look*/**', 'contracts/look*', 'contracts/relay-api*', 'contracts/message.schema.json', 'contracts/chat-groups*', 'contracts/vectors/**', 'contracts/examples/**', 'contracts/review/**', '.github/workflows/mobile.yml']
            brand: ['brand/**', 'docs/wording.md', 'workspace/**', 'workspace-addons/**', 'mobile/**', 'relay/web/**', 'publish/web/**', '.github/workflows/ci.yml', 'scripts/check_style.py']
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    uses: ./.github/workflows/contracts.yml
  workspace:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    uses: ./.github/workflows/workspace.yml
    with:
      # PRs into develop: Linux only. Everything else (push to develop/main, PRs into main, manual): + macOS.
      full: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
      # Windows (unit tests + standard-user install) only on a manual run with windows=true (owner, 7 Nov);
      # Windows changes are tested locally on a winvm clone (e2e/windows/run-as-standard-user.ps1).
      windows: ${{ github.event_name == 'workflow_dispatch' && inputs.windows }}
  addons:
    needs: changes
    if: needs.changes.outputs.addons == 'true'
    uses: ./.github/workflows/addons.yml
  publish:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    uses: ./.github/workflows/publish.yml
  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    uses: ./.github/workflows/relay.yml
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'schedule'
    uses: ./.github/workflows/mobile.yml
  brand:
    # words from docs/wording.md (R7.5) and design tokens; pure text checks, a few seconds
    needs: changes
    if: needs.changes.outputs.brand == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q brand/tests
      - run: python scripts/check_style.py
  gate:
    if: always()
    needs: [changes, contracts, workspace, addons, publish, relay, mobile, brand]
    runs-on: ubuntu-latest
    steps:
      - name: draft PRs are not tested
        if: github.event.pull_request.draft == true
        run: echo "draft PR - CI runs when it is marked ready for review" && exit 1
      - name: every called job passed or was skipped
        if: github.event.pull_request.draft != true
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          python3 - <<'PY'
          import json, sys
          bad = {k: v["result"] for k, v in json.load(open("needs.json")).items() if v["result"] not in ("success", "skipped")}
          print("bad:", bad) if bad else print("gate: ok")
          sys.exit(1 if bad else 0)
          PY
