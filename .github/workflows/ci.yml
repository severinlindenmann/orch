name: ci
on:
  pull_request:
    # draft PRs get no CI run (the gate says "draft"); marking the PR ready starts it
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      windows:
        description: "also run the Windows jobs (off by default: Windows is tested locally on the winvm VMs)"
        type: boolean
        default: false
  push:
    branches: [develop, main]
  # Nightly on develop (the default branch): the mobile suite with UI tests, even when no push ran it to the end.
  schedule:
    - cron: "0 1 * * *"
# one run per PR: a new push cancels the PR's older run (the newest commit covers it; the merge gate is the PR's own
# run). Pushes to develop/main are never cancelled: the path filter only sees the newest push, so a cancelled run of a
# mobile merge would never run the mobile UI tests (they only run after the merge). Each push gets its own group.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.f.outputs.contracts }}
      workspace: ${{ steps.f.outputs.workspace }}
      addons: ${{ steps.f.outputs.addons }}
      publish: ${{ steps.f.outputs.publish }}
      relay: ${{ steps.f.outputs.relay }}
      mobile: ${{ steps.f.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            contracts: ['contracts/**', '.github/workflows/contracts.yml']
            workspace: ['workspace/**', 'workspace-addons/*/src/**', 'contracts/**', 'install.ps1', 'install.sh', 'e2e/windows/**', '.github/workflows/workspace.yml']
            addons: ['workspace-addons/**', 'workspace/**', 'contracts/**', '.github/workflows/addons.yml']
            publish: ['publish/**', 'contracts/**', '.github/workflows/publish.yml']
            relay: ['relay/**', 'contracts/**', '.github/workflows/relay.yml']
            mobile: ['mobile/**', 'contracts/**', '.github/workflows/mobile.yml']
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    uses: ./.github/workflows/contracts.yml
  workspace:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    uses: ./.github/workflows/workspace.yml
    with:
      # PRs into develop: Linux only. Everything else (push to develop/main, PRs into main, manual): + macOS.
      full: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
      # Windows (unit tests + standard-user install) only on a manual run with windows=true (owner, 7 Nov);
      # Windows changes are tested locally on a winvm clone (e2e/windows/run-as-standard-user.ps1).
      windows: ${{ github.event_name == 'workflow_dispatch' && inputs.windows }}
  addons:
    needs: changes
    if: needs.changes.outputs.addons == 'true'
    uses: ./.github/workflows/addons.yml
  publish:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    uses: ./.github/workflows/publish.yml
  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    uses: ./.github/workflows/relay.yml
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'schedule'
    uses: ./.github/workflows/mobile.yml
  gate:
    if: always()
    needs: [changes, contracts, workspace, addons, publish, relay, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: draft PRs are not tested
        if: github.event.pull_request.draft == true
        run: echo "draft PR - CI runs when it is marked ready for review" && exit 1
      - name: every called job passed or was skipped
        if: github.event.pull_request.draft != true
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          python3 - <<'PY'
          import json, sys
          bad = {k: v["result"] for k, v in json.load(open("needs.json")).items() if v["result"] not in ("success", "skipped")}
          print("bad:", bad) if bad else print("gate: ok")
          sys.exit(1 if bad else 0)
          PY
