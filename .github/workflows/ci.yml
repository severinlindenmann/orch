name: ci
# Queue groups run and count the dashboard click-throughs again (ORCH-1107, 22 Nov: switch back of ORCH-1106 after
# ORCH-555 and ORCH-1050 were done and the click-throughs were green on 24 develop runs in a row). A push to develop
# that a green group proved runs them no more (only page-smoke, ORCH-1457). The Windows parts run in a queue group
# only when it changes file, process or path code (ORCH-1118 q6, owner 24 Nov: they left the ready pull request); they
# also run after the merge on every push to develop, on our own Windows VM (WINDOWS_RUNNER=winvm, ORCH-1127) or on
# GitHub's machines, at night and in the release check.
# A ready pull request into develop runs only the quick set (ORCH-1118 q6): banned-words, the light job (words, style,
# ruff, picked tests), the e2e smoke and the Windows + macOS CLI smoke when it touches their files (R3.4), plus the
# contracts, the phone smoke set and the dashboard pictures by path. Everything heavy runs once in its queue group.
# brand/tests/test_ci_queue_skip.py keeps ci.yml, addons.yml and docs/ci-checks.md in step.
on:
  pull_request:
    # draft PRs get no CI run (the gate says "draft"); marking the PR ready starts it
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      windows:
        description: "also run the Windows jobs (pushes to develop, the nightly run and pull requests that change file, process or path code run them by themselves)"
        type: boolean
        default: false
  push:
    branches: [develop, main]
  # Nightly on develop (the default branch): the mobile suite with UI tests, even when no push ran it to the end.
  schedule:
    - cron: "0 1 * * *"
# one run per PR: a new push cancels the PR's older run. A push to develop is NEVER cancelled (ORCH-314): every
# develop commit gets a group of its own (its sha) and runs to the end, so "last green develop commit" is a fact the
# release keeper can read (before, the next merge cancelled the running macOS suite and no develop commit was known
# green). A group with a cancel-free run still lets a newer PENDING run replace a waiting one, hence one group per sha.
# Pushes to main keep one group per branch and cancel the older run. Schedule and manual runs keep their own group.
# A re-run (run_attempt > 1) replays its ORIGINAL event, so it is not news about the PR: it gets a group of its own
# and cancels nothing. Before, re-running the red job of a draft-time run joined the PR's group and cancelled the real
# run that marking the PR ready had started (16 Nov, ORCH-7).
concurrency:
  group: ci-${{ (github.run_attempt > 1 && format('rerun-{0}', github.run_id)) || github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/develop' && format('develop-{0}', github.sha)) || (github.event_name == 'push' && format('push-{0}', github.ref)) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.run_attempt == 1 && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/develop')) }}
permissions:
  contents: read
jobs:
  changes:
    # A merge queue group the local gate already checked (group_check = local, ORCH-1124): the queue posted gate and
    # banned-words itself, so nothing runs here. ci_proven.py never counts such a run as proof for the push.
    if: "${{ github.event.pull_request.draft != true && !(startsWith(github.head_ref, 'orch-queue/') && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, 'orch-group-check: local')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contracts: ${{ steps.f.outputs.contracts }}
      workspace: ${{ steps.f.outputs.workspace }}
      smoke: ${{ steps.f.outputs.smoke }}
      e2e: ${{ steps.f.outputs.e2e }}
      addons: ${{ steps.f.outputs.addons }}
      publish: ${{ steps.f.outputs.publish }}
      relay: ${{ steps.f.outputs.relay }}
      transcription: ${{ steps.f.outputs.transcription }}
      mobile: ${{ steps.f.outputs.mobile }}
      brand: ${{ steps.f.outputs.brand }}
      dashshots: ${{ steps.f.outputs.dashshots }}
      clock: ${{ steps.f.outputs.clock }}
      perf: ${{ steps.f.outputs.perf }}
      oscode: ${{ steps.os.outputs.oscode }}
      # ORCH-545: light = a pull request into develop on its own (one light job, ~5 min); queue = a merge queue
      # group (orch-queue/...: the full suite once, whatever files it touches); proven = a push to develop with the
      # files of a green queue group (no suite again). docs/ci-checks.md.
      light: ${{ steps.place.outputs.light }}
      queue: ${{ steps.place.outputs.queue }}
      proven: ${{ steps.proven.outputs.proven }}
    permissions:
      contents: read
      actions: read  # ci_proven.py reads the queue group's ci run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the Windows check and the main release base below read the history
      # On main (release push or manual run) compare with the previous release, not with develop: after a release
      # main equals develop, so the default found 0 changed files and relay/publish built no binaries (ORCH-370).
      # A manual run on any other branch (the release keeper's full signal on develop or its release-test branch)
      # compares with main: everything since the last release. The default compared with develop and found 0
      # changed files, so 14 of 17 jobs were skipped (#2559).
      - id: base
        if: (github.ref == 'refs/heads/main' && github.event_name != 'schedule') || github.event_name == 'workflow_dispatch'
        env:
          BEFORE: ${{ github.event.before }}
          SINCE_MAIN: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          if [ "$SINCE_MAIN" = true ]; then
            sha="$(bash scripts/ci_changes_base.sh --since-main)"
          else
            sha="$(bash scripts/ci_changes_base.sh "$BEFORE")"
          fi
          echo "changes since: ${sha:-default}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: f
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            contracts: ['contracts/**', '.github/workflows/contracts.yml']
            workspace: ['workspace/**', 'workspace-addons/*/src/**', 'contracts/**', 'install.ps1', 'install.sh', 'e2e/windows/**', '.github/workflows/workspace.yml']
            smoke: ['workspace/**', 'workspace-addons/**', 'install.ps1', 'install.sh', 'e2e/ci/**', '.github/workflows/cli-smoke.yml']
            e2e: ['workspace/**', 'workspace-addons/**', 'e2e/**', 'install.sh', '.github/workflows/e2e-smoke.yml']
            addons: ['workspace-addons/**', 'workspace/**', 'contracts/**', 'e2e/focus_insights*', 'e2e/scenarios_services.py', 'e2e/dash_services_tab.cjs', '.github/workflows/addons.yml']
            publish: ['publish/**', 'contracts/**', 'workspace/src/orch_ui/static/tokens.css', 'workspace/src/orch/templates/**', '.github/workflows/publish.yml']
            relay: ['relay/**', 'contracts/**', 'workspace/src/orch_ui/static/tokens.css', '.github/workflows/relay.yml']
            transcription: ['transcription/**', 'contracts/transcription*', 'contracts/vectors/transcription*', 'contracts/vectors/publish-blob*', '.github/workflows/transcription.yml']
            # only the contracts the phone tests read (blocks, crypto, look, relay-api, message, chat-groups, vectors, examples, review)
            mobile: ['mobile/**', 'contracts/blocks*', 'contracts/crypto.md', 'contracts/look*/**', 'contracts/look*', 'contracts/relay-api*', 'contracts/message.schema.json', 'contracts/chat-groups*', 'contracts/vectors/**', 'contracts/examples/**', 'contracts/review/**', '.github/workflows/mobile.yml']
            # the dashboard's pages and what takes their pictures (ORCH-312)
            dashshots: ['workspace-addons/dashboard/src/**', 'workspace/src/orch_ui/static/**', 'workspace/src/orch/cli_shot.py', 'workspace/src/orch/dashshots.py', 'e2e/dash_ci_shots.py', '.github/workflows/dash-shots.yml']
            # the suites at a fake hour (ORCH-390): anything that can change what a page or a test does with the time
            clock: ['workspace/**', 'workspace-addons/**', 'scripts/at-clock.sh', '.github/workflows/clock.yml']
            # orch at 10,000 tickets against develop (ORCH-1609): the CLI, the add-on pages it measures, its scripts
            perf: ['workspace/**', 'workspace-addons/**', 'install.sh', 'e2e/perf/**', '.github/workflows/perf.yml']
            brand: ['brand/**', 'docs/wording.md', 'workspace/**', 'workspace-addons/**', 'mobile/**', 'relay/web/**', 'publish/web/**', '.github/workflows/**', 'scripts/check_style.py', 'scripts/check_ci_timeouts.py', 'scripts/touches_os_code.py', 'scripts/ci_known_red.py', 'scripts/ci_changes_base.sh', 'docs/ci-checks.md']
      - id: place
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          queue=false; light=false
          if [ "$EVENT" = pull_request ]; then
            case "$HEAD_REF" in
              orch-queue/*) queue=true ;;
              *) [ "$BASE_REF" = develop ] && light=true ;;
            esac
          fi
          echo "light=$light queue=$queue"
          echo "light=$light" >> "$GITHUB_OUTPUT"
          echo "queue=$queue" >> "$GITHUB_OUTPUT"
      # A queue group (or a pull request into main) that changes file, process or path code also runs the Windows
      # parts (ORCH-315, ORCH-1118 q7); a light pull request into develop never does, so it is not asked. Not while
      # Windows is known red: then they run after the merge and nightly only (--pr, docs/ci-checks.md, ORCH-453).
      - id: os
        if: github.event_name == 'pull_request' && steps.place.outputs.light != 'true'
        env:
          BASE: origin/${{ github.base_ref }}
        run: echo "oscode=$(python3 scripts/touches_os_code.py --base "$BASE" --pr --why)" >> "$GITHUB_OUTPUT"
      - id: proven
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "proven=$(python3 scripts/ci_proven.py --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY")" >> "$GITHUB_OUTPUT"
      # A known-red system with no owner or end date, or past its end date: a warning on the run, never a red check.
      - name: known red has an owner and an end date (docs/ci-checks.md)
        run: python3 scripts/ci_known_red.py --warn
  # Where this run's Mac jobs go (ORCH-1125, scripts/mac_route.py): this Mac's own runner for a push to develop, the
  # nightly run, a manual run and a release pull request while the repository variable MAC_RUNNER is this-mac and
  # the runner is online; otherwise GitHub's machines. Pull requests into develop, queue groups and forks never.
  # Never red: a problem here falls back to GitHub's machines (the outputs default below; the Mac jobs run with
  # !cancelled() and their own default even when this job failed, and the final check does not wait for it).
  # The same job decides where the Linux jobs go (ORCH-1126, scripts/edge_route.py): the orch edge test server's own
  # runner under the same rules while the repository variable EDGE_RUNNER is orch-edge; a release pull request runs
  # them there AND on GitHub's x86-64 machines (orch edge is ARM64). When they go to orch edge they all run, whatever
  # files changed (after every merge and nightly); on GitHub's machines everything stays as it was.
  # A manual run the route sends to this Mac runs the Mac jobs of a develop push (macOS workspace part, the add-on
  # Mac jobs), whatever files changed: the trial of the Mac runner (MAC_RUNNER=this-mac-manual, ORCH-1125).
  # Dashboard pictures stay pull-request only (they need its number and its changed pages).
  # The phone suite never follows the route: it stays on GitHub's Mac (see the mobile job).
  check-runner:
    uses: ./.github/workflows/check-runner.yml
    secrets:
      runner_status: ${{ secrets.MAC_RUNNER_STATUS_TOKEN }}
  route:
    needs: check-runner
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mac: ${{ steps.r.outputs.mac || '"macos-latest"' }}
      linux: ${{ steps.r.outputs.linux || '"ubuntu-latest"' }}
      where: ${{ steps.r.outputs.where || 'github' }}
      edge: ${{ steps.e.outputs.edge || '["ubuntu-latest"]' }}
      edge_where: ${{ steps.e.outputs.edge_where || 'github' }}
      checks: ${{ needs.check-runner.outputs.machine || '"ubuntu-latest"' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/mac_route.py
            scripts/edge_route.py
          sparse-checkout-cone-mode: false
      - id: r
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          MAC_RUNNER: ${{ vars.MAC_RUNNER }}
          MAC_RUNNER_WHEN_BUSY: ${{ vars.MAC_RUNNER_WHEN_BUSY }}
          # read-only runner list; never handed to a pull request into develop (its code runs this step)
          STATUS_TOKEN: ${{ (github.event_name != 'pull_request' || (github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAC_RUNNER_STATUS_TOKEN || '' }}
        run: python3 scripts/mac_route.py
      - id: e
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          EDGE_RUNNER: ${{ vars.EDGE_RUNNER }}
          EDGE_RUNNER_WHEN_BUSY: ${{ vars.EDGE_RUNNER_WHEN_BUSY }}
          STATUS_TOKEN: ${{ (github.event_name != 'pull_request' || (github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.MAC_RUNNER_STATUS_TOKEN || '' }}
        run: python3 scripts/edge_route.py
  # The light set of a pull request into develop on its own: words, style, ruff, the workspace tests that read the
  # changed code and the suites of the changed add-ons, one job (scripts/ci_light.py, ORCH-556). The rest runs once
  # in its merge queue group; the Focus and Insights page smoke too (addons.yml page-smoke, ORCH-1118 q6).
  light:
    needs: changes
    if: needs.changes.outputs.light == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # owner 21 Nov (ORCH-1187, #2319): bundles touching the core, the dashboard and add-ons need 9-11 min
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the diff against the base branch
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install pytest
      - run: python3 scripts/ci_light.py --base "origin/${{ github.base_ref }}"
  contracts:
    needs: [changes, route]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.proven != 'true' && (needs.changes.outputs.contracts == 'true' || needs.changes.outputs.queue == 'true') }}
    uses: ./.github/workflows/contracts.yml
    with:
      checks: ${{ needs.route.outputs.checks || '"ubuntu-latest"' }}
  workspace:
    needs: [changes, route]
    # light pull requests skip it (ORCH-1118 q6); a queue group or a pull request into main that changes file, process
    # or path code while Windows is green (oscode) adds the Windows parts
    # A push to develop that a green queue group proved runs only the Windows parts (groups run them only for file,
    # process or path code: ORCH-1107, ORCH-1118).
    # With the Windows parts on our own Windows VM (vars.WINDOWS_RUNNER == 'winvm', ORCH-1127) a proven push has nothing
    # left here (no Linux, no macOS, no Windows): skipped, else the empty part list fails the run.
    if: ${{ !cancelled() && needs.changes.result == 'success' && ((needs.changes.outputs.proven != 'true' || vars.WINDOWS_RUNNER != 'winvm') && (needs.changes.outputs.proven == 'true' || (needs.changes.outputs.light != 'true' && (needs.changes.outputs.workspace == 'true' || needs.changes.outputs.queue == 'true')) || (needs.changes.outputs.oscode == 'true' && needs.changes.outputs.light != 'true') || github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && needs.route.outputs.where == 'mac')) }}
    uses: ./.github/workflows/workspace.yml
    with:
      linux: ${{ needs.changes.outputs.proven != 'true' }}
      # No `checks` here: the Linux shards stay on GitHub's machines. On orch edge each proof run had another
      # timing test go red (runwatch, broken ticket, bgwork, dispatcher; ORCH-1932), later ticket ORCH-2329.
      # PRs into develop and merge queue groups: Linux only (+ the CLI smoke on Windows/macOS below). macOS and
      # Windows run on develop itself: every push (never cancelled, see concurrency), the nightly run and the
      # release check (the keeper's manual run with windows=true); a red one opens the release keeper's
      # red-develop ticket (releasekeeper.develop_red). Merge queue groups ran all three systems for a day
      # (PR 1428) and waited 50+ minutes on GitHub's 5 macOS machines at once (18 Nov, ORCH-315).
      # PRs into main and manual runs keep macOS too. Each system stays split into parts under 15 minutes.
      full: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main') && needs.changes.outputs.proven != 'true' }}
      # Windows: every push to develop, the nightly run, a manual run with windows=true, and queue groups and pull
      # requests into main that change file, process or path code while Windows is not known red
      # (scripts/touches_os_code.py --pr); never a light pull request (ORCH-1118 q6, owner 24 Nov: such a pull request
      # ran 20 Windows parts on every push, about 150 runner-minutes). Which check is required where: docs/ci-checks.md.
      # ORCH-1127: the repository variable WINDOWS_RUNNER=winvm moves the develop pushes and the nightly run to a fresh
      # Windows VM clone on our own machine (e2e/winvm/, result as the commit status 'windows (winvm)'); unset or any other
      # value = GitHub's machines (the switch back). Release checks and pull requests stay on GitHub (x86-64).
      windows: ${{ (vars.WINDOWS_RUNNER != 'winvm' && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/develop'))) || (github.event_name == 'workflow_dispatch' && inputs.windows) || (needs.changes.outputs.oscode == 'true' && needs.changes.outputs.light != 'true') }}
      mac_runs_on: ${{ needs.route.outputs.mac || '"macos-latest"' }}
  # Fast CLI smoke on Windows + macOS for PRs that touch the CLI or an add-on (R1.6, R3.4); the full suite is nightly.
  # Queue groups always; every pull request (light ones too, ORCH-1118 q6) when it touches its files.
  cli-smoke:
    needs: changes
    if: needs.changes.outputs.queue == 'true' || (needs.changes.outputs.smoke == 'true' && github.event_name == 'pull_request')
    uses: ./.github/workflows/cli-smoke.yml
  # The 5-minute e2e smoke set (the fake-agent F1/F2 scenarios) on every pull request that can change what it tests,
  # light ones too (R3.4, ORCH-1118 q6); the full suite is nightly.
  e2e-smoke:
    needs: [changes, route]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.queue == 'true' || (needs.changes.outputs.e2e == 'true' && github.event_name == 'pull_request') || needs.route.outputs.edge_where == 'edge' || needs.route.outputs.edge_where == 'both') }}
    uses: ./.github/workflows/e2e-smoke.yml
    with:
      runs_on: ${{ needs.route.outputs.edge || '["ubuntu-latest"]' }}
  addons:
    needs: [changes, route]
    # A push to develop that a green group proved runs only page-smoke (it runs the Focus click-through, ORCH-1457);
    # the click-throughs ran in the group (ORCH-1107). Every other place runs the suites and the click-throughs.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.proven == 'true' || (needs.changes.outputs.light != 'true' && (needs.changes.outputs.addons == 'true' || needs.changes.outputs.queue == 'true')) || needs.route.outputs.edge_where == 'edge' || needs.route.outputs.edge_where == 'both' || (github.event_name == 'workflow_dispatch' && needs.route.outputs.where == 'mac')) }}
    uses: ./.github/workflows/addons.yml
    with:
      suites: ${{ needs.changes.outputs.proven != 'true' }}
      checks: ${{ needs.route.outputs.checks || '"ubuntu-latest"' }}
      # the Services add-on with its real Linux run (ORCH-1126): with the suites, and always when it goes to orch edge
      services: ${{ needs.changes.outputs.proven != 'true' || needs.route.outputs.edge_where == 'edge' || needs.route.outputs.edge_where == 'both' }}
      linux_runs_on: ${{ needs.route.outputs.edge || '["ubuntu-latest"]' }}
      clickthroughs: ${{ needs.changes.outputs.proven != 'true' }}
      mac_jobs_runs_on: ${{ needs.route.outputs.linux || '"ubuntu-latest"' }}
  # publish, relay and transcription: in the queue group (by path), not on a light pull request (ORCH-1118 q6)
  publish:
    needs: [changes, route]
    if: ${{ !cancelled() && needs.changes.result == 'success' && ((needs.changes.outputs.proven != 'true' && needs.changes.outputs.light != 'true' && needs.changes.outputs.publish == 'true') || needs.route.outputs.edge_where == 'edge' || needs.route.outputs.edge_where == 'both') }}
    uses: ./.github/workflows/publish.yml
    with:
      runs_on: ${{ needs.route.outputs.edge || '["ubuntu-latest"]' }}
  relay:
    needs: [changes, route]
    if: ${{ !cancelled() && needs.changes.result == 'success' && ((needs.changes.outputs.proven != 'true' && needs.changes.outputs.light != 'true' && needs.changes.outputs.relay == 'true') || needs.route.outputs.edge_where == 'edge' || needs.route.outputs.edge_where == 'both') }}
    uses: ./.github/workflows/relay.yml
    with:
      runs_on: ${{ needs.route.outputs.edge || '["ubuntu-latest"]' }}
  transcription:
    needs: changes
    if: needs.changes.outputs.proven != 'true' && needs.changes.outputs.light != 'true' && needs.changes.outputs.transcription == 'true'
    uses: ./.github/workflows/transcription.yml
  mobile:
    # Not in merge queue groups (ORCH-1118, owner yes on 20 Nov: 21 min in 47 percent of groups): pull requests that
    # change the phone app run the smoke set, every push to develop that changes it and the nightly run the full
    # suite (a green group no longer proves the phone app, so it runs on develop even then), and so do release pull
    # requests into main, where it still counts before the merge.
    needs: [changes, route]
    # Always on GitHub's Mac, whatever the route says (owner 23 Nov, ORCH-1125 trial): on this Mac's runner the suite
    # did not finish in 75 minutes (GitHub: 45-48) and held the one runner and the xcodebuild lock for helpers.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (github.event_name == 'schedule' || (needs.changes.outputs.mobile == 'true' && needs.changes.outputs.queue != 'true')) }}
    uses: ./.github/workflows/mobile.yml
    with:
      runs_on: '"macos-latest"'
  # The add-on suites, the page tests and the workspace tests that name a day at 22:30 and 23:59:40 UTC: a test that
  # only passes by day goes red here, on its pull request, not on develop at night (ORCH-390, #1371, #1421).
  clock:
    needs: [changes, route]
    if: ${{ !cancelled() && needs.changes.result == 'success' && ((needs.changes.outputs.light != 'true' && needs.changes.outputs.proven != 'true' && (needs.changes.outputs.clock == 'true' || needs.changes.outputs.queue == 'true' || github.event_name == 'schedule')) || needs.route.outputs.edge_where == 'edge' || needs.route.outputs.edge_where == 'both') }}
    uses: ./.github/workflows/clock.yml
    with:
      runs_on: ${{ needs.route.outputs.edge || '["ubuntu-latest"]' }}
  brand:
    # words from docs/wording.md (R7.5), design tokens and a time limit on every CI job; pure text checks, a few seconds.
    # Always on GitHub's machines: brand/tests/test_edge_runner.py runs the edge runner's own hooks and setup, which
    # act for real on that runner (ORCH-1932).
    needs: changes
    if: needs.changes.outputs.light != 'true' && needs.changes.outputs.proven != 'true' && (needs.changes.outputs.brand == 'true' || needs.changes.outputs.queue == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q brand/tests
      - run: python scripts/check_style.py
  dash-shots:
    # pictures of the dashboard pages a pull request changes, for its review card (ORCH-312); never in a merge queue
    # group: its pull requests took their pictures already (ORCH-1118)
    needs: [changes, route]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.dashshots == 'true' && github.event_name == 'pull_request' && needs.changes.outputs.queue != 'true') }}
    uses: ./.github/workflows/dash-shots.yml
    with:
      runs_on: ${{ needs.route.outputs.linux || '"ubuntu-latest"' }}
  # orch at 10,000 seeded tickets in queue groups that touch orch (ORCH-1609): fails only on more than 30% slower
  # than develop's newest nightly numbers, never on the owner's absolute limits (R8.3). About 5 minutes.
  perf:
    needs: changes
    if: needs.changes.outputs.queue == 'true' && needs.changes.outputs.perf == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/perf.yml
    with:
      against_develop: true
  gate:
    if: "${{ always() && !(startsWith(github.head_ref, 'orch-queue/') && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, 'orch-group-check: local')) }}"
    needs: [changes, light, contracts, workspace, cli-smoke, e2e-smoke, addons, publish, relay, transcription, mobile, clock, brand, dash-shots, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: draft PRs are not tested
        if: github.event.pull_request.draft == true
        # a re-run of this job replays the draft-time event and lands here again, however the PR looks now
        run: |
          echo "draft PR - CI runs when it is marked ready for review"
          echo "Re-running this job does not help: it replays the draft-time event and stays red."
          echo "PR already marked ready? Look at its newest ci run. No such run: push a commit to start one."
          exit 1
      - name: every called job passed or was skipped
        if: github.event.pull_request.draft != true
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          python3 - <<'PY'
          import json, sys
          bad = {k: v["result"] for k, v in json.load(open("needs.json")).items() if v["result"] not in ("success", "skipped")}
          print("bad:", bad) if bad else print("gate: ok")
          sys.exit(1 if bad else 0)
          PY
