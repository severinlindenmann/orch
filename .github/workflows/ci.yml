name: ci
on:
  pull_request:
    # draft PRs get no CI run (the gate says "draft"); marking the PR ready starts it
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      windows:
        description: "also run the Windows jobs (the nightly run, the 3-hourly develop run and pull requests that change file, process or path code run them by themselves)"
        type: boolean
        default: false
  push:
    branches: [develop, main]
  # Cron is UTC. 01:00 = the nightly run on develop (the default branch): every suite, the mobile UI tests too.
  # The other one = the full macOS and Windows run on develop's newest commit every 3 hours (ORCH-452); it does
  # nothing when that commit already had a finished scheduled run (see "fresh" below). The release keeper starts the
  # same full run by hand before a release when no scheduled run on the release commit is green.
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 4,7,10,13,16,19,22 * * *"
# One run per PR: a new push cancels the PR's older run.
# Develop runs once per new state (ORCH-452): a push to develop runs the Linux checks only (the merge queue group
# already checked that state on top of develop), all pushes share ONE group and a started develop run is never
# cancelled. A newer push only replaces a run that is still WAITING (GitHub drops it before it starts, 0 minutes),
# so develop never burns minutes in cancelled runs (night of 17/18 Nov: 1469 minutes) and a burst of merges ends in
# one run on the newest commit. The 3-hourly full run has one such group too; the nightly run has its own.
# Pushes to main keep one group per branch and cancel the older run. Manual runs keep their own group.
# A re-run (run_attempt > 1) replays its ORIGINAL event, so it is not news about the PR: it gets a group of its own
# and cancels nothing. Before, re-running the red job of a draft-time run joined the PR's group and cancelled the real
# run that marking the PR ready had started (16 Nov, ORCH-7).
concurrency:
  group: ci-${{ (github.run_attempt > 1 && format('rerun-{0}', github.run_id)) || github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'develop-push') || (github.event_name == 'push' && format('push-{0}', github.ref)) || (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *' && 'nightly') || (github.event_name == 'schedule' && 'develop-full') || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.run_attempt == 1 && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/develop')) }}
permissions:
  contents: read
jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # the "fresh" step reads this workflow's earlier scheduled runs
    outputs:
      # schedule runs only: "nightly" (01:00, every suite), "full" (3-hourly macOS + Windows on a new develop
      # commit) or "none" (3-hourly, but that commit already had a finished scheduled run: nothing runs)
      sched: ${{ steps.sched.outputs.sched }}
      contracts: ${{ steps.f.outputs.contracts }}
      workspace: ${{ steps.f.outputs.workspace }}
      smoke: ${{ steps.f.outputs.smoke }}
      e2e: ${{ steps.f.outputs.e2e }}
      addons: ${{ steps.f.outputs.addons }}
      publish: ${{ steps.f.outputs.publish }}
      relay: ${{ steps.f.outputs.relay }}
      mobile: ${{ steps.f.outputs.mobile }}
      brand: ${{ steps.f.outputs.brand }}
      clock: ${{ steps.f.outputs.clock }}
      oscode: ${{ steps.os.outputs.oscode }}
    steps:
      - id: sched
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$CRON" = "0 1 * * *" ]; then echo "sched=nightly" >> "$GITHUB_OUTPUT"; exit 0; fi
          # the newest scheduled run on develop that ran to the end (a dropped or cancelled one does not count)
          last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch develop --event schedule \
            --status completed --limit 20 --json headSha,conclusion \
            --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].headSha // ""')" || last=""
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "develop ${GITHUB_SHA:0:8} already had its full run: nothing to do"
            echo "sched=none" >> "$GITHUB_OUTPUT"
          else
            echo "sched=full" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule'
        with:
          fetch-depth: 0  # the Windows check and the main release base below read the history
      # On main (release push or manual run) compare with the previous release, not with develop: after a release
      # main equals develop, so the default found 0 changed files and relay/publish built no binaries (ORCH-370).
      - id: base
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          sha="$(bash scripts/ci_changes_base.sh "$BEFORE")"
          echo "changes since: ${sha:-default}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: f
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            contracts: ['contracts/**', '.github/workflows/contracts.yml']
            workspace: ['workspace/**', 'workspace-addons/*/src/**', 'contracts/**', 'install.ps1', 'install.sh', 'e2e/windows/**', '.github/workflows/workspace.yml']
            smoke: ['workspace/**', 'workspace-addons/**', 'install.ps1', 'install.sh', 'e2e/ci/**', '.github/workflows/cli-smoke.yml']
            e2e: ['workspace/**', 'workspace-addons/**', 'e2e/**', 'install.sh', '.github/workflows/e2e-smoke.yml']
            addons: ['workspace-addons/**', 'workspace/**', 'contracts/**', 'e2e/focus_insights*', '.github/workflows/addons.yml']
            publish: ['publish/**', 'contracts/**', 'workspace/src/orch_ui/static/tokens.css', 'workspace/src/orch/templates/**', '.github/workflows/publish.yml']
            relay: ['relay/**', 'contracts/**', 'workspace/src/orch_ui/static/tokens.css', '.github/workflows/relay.yml']
            # only the contracts the phone tests read (blocks, crypto, look, relay-api, message, chat-groups, vectors, examples, review)
            mobile: ['mobile/**', 'contracts/blocks*', 'contracts/crypto.md', 'contracts/look*/**', 'contracts/look*', 'contracts/relay-api*', 'contracts/message.schema.json', 'contracts/chat-groups*', 'contracts/vectors/**', 'contracts/examples/**', 'contracts/review/**', '.github/workflows/mobile.yml']
            # the suites at a fake hour (ORCH-390): anything that can change what a page or a test does with the time
            clock: ['workspace/**', 'workspace-addons/**', 'scripts/at-clock.sh', '.github/workflows/clock.yml']
            brand: ['brand/**', 'docs/wording.md', 'workspace/**', 'workspace-addons/**', 'mobile/**', 'relay/web/**', 'publish/web/**', '.github/workflows/**', 'scripts/check_style.py', 'scripts/check_ci_timeouts.py', 'scripts/touches_os_code.py', 'scripts/ci_known_red.py', 'scripts/ci_changes_base.sh', 'docs/ci-checks.md']
      # A pull request that changes file, process or path code also runs the Windows tests (ORCH-315), but not while
      # Windows is known red: then its parts run on queue groups and nightly only (--pr, docs/ci-checks.md, ORCH-453).
      - id: os
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: echo "oscode=$(python3 scripts/touches_os_code.py --base "$BASE" --pr --why)" >> "$GITHUB_OUTPUT"
      # A known-red system with no owner or end date, or past its end date: a warning on the run, never a red check.
      - name: known red has an owner and an end date (docs/ci-checks.md)
        run: python3 scripts/ci_known_red.py --warn
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    uses: ./.github/workflows/contracts.yml
  workspace:
    needs: changes
    if: needs.changes.outputs.workspace == 'true' || needs.changes.outputs.sched == 'nightly' || needs.changes.outputs.sched == 'full'
    uses: ./.github/workflows/workspace.yml
    with:
      # PRs into develop, merge queue groups and pushes to develop: Linux only (+ the CLI smoke on Windows/macOS
      # below on PRs). macOS and Windows run on develop's newest commit every 3 hours, in the nightly run and in the
      # release check (the keeper's manual run with windows=true); a red one opens the release keeper's red-develop
      # ticket (releasekeeper.develop_red). Merge queue groups ran all three systems for a day (PR 1428) and waited
      # 50+ minutes on GitHub's 5 macOS machines at once (18 Nov, ORCH-315); every push to develop ran macOS too and
      # took 1558 macOS minutes in one night (ORCH-452), for states the queue group had already checked.
      # PRs into main, pushes to main and manual runs keep macOS too. Each system stays split into parts under 15
      # minutes.
      full: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref != 'refs/heads/develop') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      # Windows: the nightly and 3-hourly runs, a manual run with windows=true and pull requests that change file,
      # process or path code while Windows is not known red (scripts/touches_os_code.py --pr), except merge queue
      # groups. Which check is required where: docs/ci-checks.md.
      windows: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.windows) || (needs.changes.outputs.oscode == 'true' && !startsWith(github.head_ref, 'orch-queue/')) }}
  # Fast CLI smoke on Windows + macOS for PRs that touch the CLI or an add-on (R1.6, R3.4); the full suite is nightly.
  cli-smoke:
    needs: changes
    if: needs.changes.outputs.smoke == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/cli-smoke.yml
  # The 5-minute e2e smoke set on every pull request that can change what it tests (R3.4); the full suite is nightly.
  e2e-smoke:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/e2e-smoke.yml
  addons:
    needs: changes
    if: needs.changes.outputs.addons == 'true'
    uses: ./.github/workflows/addons.yml
  publish:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    uses: ./.github/workflows/publish.yml
  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    uses: ./.github/workflows/relay.yml
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.sched == 'nightly'
    uses: ./.github/workflows/mobile.yml
  # The add-on suites, the page tests and the workspace tests that name a day at 22:30 and 23:59:40 UTC: a test that
  # only passes by day goes red here, on its pull request, not on develop at night (ORCH-390, #1371, #1421).
  clock:
    needs: changes
    if: needs.changes.outputs.clock == 'true' || needs.changes.outputs.sched == 'nightly'
    uses: ./.github/workflows/clock.yml
  brand:
    # words from docs/wording.md (R7.5), design tokens and a time limit on every CI job; pure text checks, a few seconds
    needs: changes
    if: needs.changes.outputs.brand == 'true' || needs.changes.outputs.sched == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q brand/tests
      - run: python scripts/check_style.py
  gate:
    if: always()
    needs: [changes, contracts, workspace, cli-smoke, e2e-smoke, addons, publish, relay, mobile, clock, brand]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: draft PRs are not tested
        if: github.event.pull_request.draft == true
        # a re-run of this job replays the draft-time event and lands here again, however the PR looks now
        run: |
          echo "draft PR - CI runs when it is marked ready for review"
          echo "Re-running this job does not help: it replays the draft-time event and stays red."
          echo "PR already marked ready? Look at its newest ci run. No such run: push a commit to start one."
          exit 1
      - name: every called job passed or was skipped
        if: github.event.pull_request.draft != true
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          python3 - <<'PY'
          import json, sys
          bad = {k: v["result"] for k, v in json.load(open("needs.json")).items() if v["result"] not in ("success", "skipped")}
          print("bad:", bad) if bad else print("gate: ok")
          sys.exit(1 if bad else 0)
          PY
