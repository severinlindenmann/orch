name: contracts
on:
  workflow_call:
    inputs:
      checks:
        type: string
        default: '"ubuntu-latest"'
jobs:
  validate:
    runs-on: ${{ fromJSON(inputs.checks) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/edge-job-home
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --with jsonschema --with rfc3339-validator --with cryptography python contracts/validate.py
