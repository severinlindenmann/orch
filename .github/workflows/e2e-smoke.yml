name: e2e-smoke
# A short e2e set on every pull request that touches the CLI, an add-on, the e2e scenarios or the installer: 14
# scenarios without relay/publish servers and without agents, so no cargo build. Under 5 minutes (the step has a hard
# limit of 5). The full suite (e2e.yml) runs at night and before each release.
on:
  workflow_call:
    inputs:
      runs_on:
        description: "where it runs, as a JSON list of runs-on values, one leg each: [\"ubuntu-latest\"], or the orch edge runner's labels, or both on a release pull request (ci.yml job route, ORCH-1126)"
        type: string
        default: '["ubuntu-latest"]'
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(inputs.runs_on) }}
    name: smoke${{ matrix.machine != 'ubuntu-latest' && ' (orch edge)' || '' }}
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/edge-job-home
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke set
        timeout-minutes: 5
        run: e2e/run.sh smoke --mode local
