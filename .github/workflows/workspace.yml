name: workspace
on:
  workflow_call:
    inputs:
      full:
        description: "also run macOS and Windows (push to develop/main, PRs into main, manual runs)"
        type: boolean
        default: false
      install:
        description: "the install path changed: run the Windows standard-user install on PRs too"
        type: boolean
        default: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # The suite takes 3-6 min; a hung test must not hold the runner for GitHub's 6 h default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        if: runner.os != 'Windows'
      # Windows: a test that hangs is stopped after 120 s with every thread's stack, so the log names it.
      - run: uv run --with pytest-timeout pytest -q --timeout 120 --timeout-method thread
        if: runner.os == 'Windows'
      - name: Installed wheel smoke (orch init, junction on Windows)
        shell: bash
        run: |
          uv build --wheel -o "$RUNNER_TEMP/dist"
          uv tool install --reinstall "$RUNNER_TEMP"/dist/orch_workspace-*.whl
          d="$RUNNER_TEMP/smoke"; mkdir -p "$d"; cd "$d"
          ORCH_AGENT=claude orch init  # no agent is installed on the runner; this one links its skills folder
          orch ticket new "smoke" --json
          test -f .agents/skills/orch/SKILL.md
          test -f .claude/skills/orch/SKILL.md
          orch ticket list
      - name: Junction check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $item = Get-Item "$env:RUNNER_TEMP\smoke\.claude\skills" -Force
          if ($item.LinkType -ne "Junction") { throw "expected a junction, got $($item.LinkType)" }
  windows-standard-user:
    if: inputs.full || inputs.install
    # The README's Windows install as a standard user (no admin), no git, default execution
    # policy, from this commit's GitHub zip; then init, a ticket, an add-on and an update (e2e/windows/).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and first steps as a standard user
        shell: powershell
        run: .\e2e\windows\run-as-standard-user.ps1 -Ref "${{ github.event.pull_request.head.sha || github.sha }}"
