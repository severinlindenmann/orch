name: workspace
on:
  workflow_call:
    inputs:
      full:
        description: "also run macOS (push to develop/main, PRs into main, nightly, manual runs; not merge queue groups)"
        type: boolean
        default: false
      windows:
        description: "also run Windows (push to develop, PRs that change file, process or path code, nightly, manual)"
        type: boolean
        default: false
      mac_runs_on:
        description: "where the macOS parts run, as JSON: \"macos-latest\" or this Mac's runner labels (ci.yml job route, ORCH-1125)"
        type: string
        default: '"macos-latest"'
      linux:
        description: "the Linux parts (off only on a push to develop that a green queue group proved: only the Windows parts run then, ORCH-1107)"
        type: boolean
        default: true
      checks:
        type: string
        default: '"ubuntu-latest"'
env:
  # Tests a person set aside on a "Broken test" ticket (ORCH-455, the pull-requests add-on writes the variable):
  # every pytest run still runs them and shows them, as an expected failure (.github/pytest/orch_aside.py).
  ORCH_ASIDE: ${{ vars.ORCH_ASIDE }}
  PYTEST_PLUGINS: orch_aside
  PYTHONPATH: ${{ github.workspace }}/.github/pytest
jobs:
  # Which systems and how many parts each (ORCH-315). Every part has a 15-minute limit (Windows 20); the full
  # suite takes about 12 min on Ubuntu, 22-40 min on macOS and ~140 min on Windows (ORCH-32), so the slow systems
  # get more parts (measured 18 Nov: Ubuntu parts 7-9 min, macOS parts 6-9 min). Ubuntu has 3 parts since 25 Nov
  # (ORCH-1118): with 2 its parts took 6.3-9.4 min and ended every merge queue group last.
  # Each part runs every N-th test by a hash of its name (workspace/tests/ci_parts.py, --part K/N). Windows is
  # split by measured time instead (--part-times, ORCH-1050): by hash, part 12 of 16 got most of the 60-110 s
  # bring-back tests and was killed at 15m0s with every test passed (releases 35 and 38) while part 1 took 3 min.
  # Time-split 20 parts take ~9 min of their 20; the "Time used" step warns once a part passes 70 percent.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          FULL: ${{ inputs.full }}
          WINDOWS: ${{ inputs.windows }}
          MAC_RUNS_ON: ${{ inputs.mac_runs_on }}
          LINUX: ${{ inputs.linux }}
          CHECKS: ${{ inputs.checks }}
        run: |
          python3 - <<'PY2'
          import json, os
          # Systems whose failures do not block a merge (the mechanism is kept for the next time a system is red).
          # Windows was in it until ORCH-32 (pull request 1045): its parts now block again.
          # Known red works per STEP (continue-on-error on the test steps below), never on the job: a job-level
          # continue-on-error still reports a FAILURE check on the pull request, and the merge queue drops every
          # group with a failed check (18 Nov, after PR 1428). brand/tests/test_ci_known_red.py keeps it so.
          KNOWN_RED = set()
          parts = {"ubuntu-latest": 3} if os.environ["LINUX"] == "true" else {}
          # this Mac's own runner takes one job at a time: the macOS suite is ONE part there (-n 6, 45 min limit)
          # instead of 5 parts on GitHub's machines (ORCH-1125)
          mac_runs_on = json.loads(os.environ.get("MAC_RUNS_ON") or '"macos-latest"')
          own_mac = mac_runs_on != "macos-latest"
          linux_runs_on = json.loads(os.environ.get("CHECKS") or '"ubuntu-latest"')
          if os.environ["FULL"] == "true":
              parts["macos-latest"] = 1 if own_mac else 5
          if os.environ["WINDOWS"] == "true":
              parts["windows-latest"] = 20
          LIMIT = {"windows-latest": 20}  # minutes per part; 15 elsewhere (the Time used step reads it too)
          if own_mac:
              LIMIT["macos-latest"] = 45  # the one macOS part on this Mac's own runner
          if linux_runs_on != "ubuntu-latest":
              LIMIT["ubuntu-latest"] = 30  # two workers per shard on the shared ARM host
          rows = [
              {
                  "os": o, "part": k, "parts": n, "known_red": o in KNOWN_RED,
                  "runs_on": {"macos-latest": mac_runs_on, "ubuntu-latest": linux_runs_on}.get(o, o),
                  "workers": "6" if (o == "macos-latest" and own_mac) else "auto",
                  "limit": LIMIT.get(o, 15),
              }
              for o, n in parts.items()
              for k in range(1, n + 1)
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": rows}) + "\n")
          print(json.dumps(rows, indent=1))
          PY2
  test:
    needs: plan
    name: test (${{ matrix.os }}, ${{ matrix.part }}/${{ matrix.parts }})
    strategy:
      fail-fast: false
      # Sprint PRs share hosted slots with the merge queue. Keep every part, but don't start 20 at once.
      # 256 is GitHub's matrix size limit, so other runs retain their normal parallelism.
      max-parallel: ${{ github.event_name == 'pull_request' && github.base_ref == 'develop' && startsWith(github.head_ref, 'copilot/') && 2 || 256 }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    # One part: under its limit (15 minutes, Windows 20, 45 for the one macOS part on this Mac's own runner) set-up
    # included. A hanging test stops after 300 s (pytest-timeout in workspace/pyproject.toml); a test over its time
    # budget fails (--budget below).
    timeout-minutes: ${{ matrix.limit }}
    defaults:
      run:
        working-directory: workspace
    steps:
      - name: Start time
        shell: bash
        working-directory: ${{ github.workspace }}  # before the checkout: workspace/ is not there yet
        run: echo "PART_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mac-job-home
        if: runner.os == 'macOS'
      - uses: ./.github/actions/edge-job-home
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup-uv
      # Windows: orch's safe git runs the python of the virtual environment as its `true` and refuses a python
      # inside the project folder, so every git test failed. Keep the environment outside the project (ORCH-32).
      - name: Virtual environment outside the project (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/orch-venv" >> "$GITHUB_ENV"
      - run: uv sync
      - run: uv run ruff check .
        if: matrix.part == 1
      - run: uv run ruff format --check .
        if: matrix.part == 1
      # -n auto: the runners have 3-4 vCPU (pytest-xdist is a dev dependency; the suite is xdist-safe, #237).
      # --durations=30 (pyproject.toml) lists the 30 slowest tests of every part at the end of its log.
      # Time budget per test: 90 s on Ubuntu (slowest ~34 s, but up to 60 s on a slow runner), 180 s on the slower macOS and Windows runners
      # (slowest today ~102 s on macOS); a test that needs longer says why with @pytest.mark.budget(N).
      - id: tests-linux
        run: uv run pytest -q -n auto --part ${{ matrix.part }}/${{ matrix.parts }} --budget 90
        if: runner.os == 'Linux'
        continue-on-error: ${{ matrix.known_red }}
      - id: tests-macos
        run: uv run pytest -q -n ${{ matrix.workers }} --part ${{ matrix.part }}/${{ matrix.parts }} --budget 180
        if: runner.os == 'macOS'
        continue-on-error: ${{ matrix.known_red }}
      # Windows: a hung test stops at the 300 s of pyproject.toml, with every thread's stack. Not 120 s: the thread method
      # then kills the whole worker, and the 100 s bring-back tests crossed it on a loaded runner (ORCH-32).
      # Split by measured time (tests/ci_times_windows.json); --times-out keeps this part's seconds as an artifact
      # so the file can be refreshed: python tests/ci_parts.py merge tests/ci_times_windows.json <files...>
      - id: tests-windows
        run: uv run pytest -q -n auto --part ${{ matrix.part }}/${{ matrix.parts }} --part-times tests/ci_times_windows.json --times-out "${{ runner.temp }}/ci-times.json" --budget 180 --timeout-method thread
        if: runner.os == 'Windows'
        continue-on-error: ${{ matrix.known_red }}
      - name: Installed wheel smoke (orch init, junction on Windows)
        id: smoke
        if: matrix.part == 1
        continue-on-error: ${{ matrix.known_red }}
        shell: bash
        run: |
          uv build --wheel -o "$RUNNER_TEMP/dist"
          uv tool install --reinstall "$RUNNER_TEMP"/dist/orch_workspace-*.whl
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ] && [ "$RUNNER_OS" = Linux ]; then
            export PATH="$(uv tool dir --bin):$PATH"
          fi
          d="$RUNNER_TEMP/smoke"; mkdir -p "$d"; cd "$d"
          ORCH_AGENT=claude orch init  # no agent is installed on the runner; this one links its skills folder
          orch ticket new "smoke" --json
          test -f .agents/skills/orch/SKILL.md
          test -f .claude/skills/orch/SKILL.md
          orch ticket list
      - name: Junction check (Windows)
        id: junction
        if: runner.os == 'Windows' && matrix.part == 1
        continue-on-error: ${{ matrix.known_red }}
        shell: pwsh
        run: |
          # Since #215 .claude\skills is a plain folder with one link per skill (a copy where links are refused)
          $item = Get-Item "$env:RUNNER_TEMP\smoke\.claude\skills\orch" -Force
          if ($item.LinkType -ne "Junction" -and -not (Test-Path "$env:RUNNER_TEMP\smoke\.claude\skills\orch\.orch-copy")) {
            throw "expected .claude\skills\orch to be a junction, got '$($item.LinkType)'"
          }
      - name: Test times (Windows)
        if: always() && runner.os == 'Windows' && steps.tests-windows.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-times-windows-${{ matrix.part }}
          path: ${{ runner.temp }}/ci-times.json
          retention-days: 14
          if-no-files-found: ignore
      # A part near its limit is the next one to be killed with every test passed (ORCH-1050): warn at 70 percent.
      # Counted from the first step (GitHub's own set-up before it, ~10-30 s, is not in it).
      - name: Time used
        if: always() && env.PART_START != ''
        continue-on-error: true
        shell: bash
        env:
          LIMIT_MIN: ${{ matrix.limit }}
          PART: ${{ matrix.os }} part ${{ matrix.part }}/${{ matrix.parts }}
        run: |
          used=$(( $(date +%s) - PART_START )); pct=$(( used * 100 / (LIMIT_MIN * 60) ))
          line="$PART used $((used / 60))m$((used % 60))s of its ${LIMIT_MIN}-minute limit (${pct}%)"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$pct" -gt 70 ]; then
            echo "::warning title=Near the time limit::$line. Over 70 percent: rebalance the parts (Windows: refresh tests/ci_times_windows.json from the ci-times artifacts) or add parts (ORCH-1050)"
          fi
      - name: Known red (the check stays green, the failure is only a warning)
        if: matrix.known_red && (contains(steps.*.outcome, 'failure'))
        shell: bash
        run: echo "::warning title=Known red::${{ matrix.os }} part ${{ matrix.part }}/${{ matrix.parts }} failed; it does not block while ${{ matrix.os }} is in KNOWN_RED (ORCH-32)"
  windows-standard-user:
    if: inputs.windows
    # The README's Windows install as a standard user (no admin), no git, default execution
    # policy, from this commit's GitHub zip; then init, a ticket, an add-on and an update (e2e/windows/).
    runs-on: windows-latest
    timeout-minutes: 15  # ~6 min
    steps:
      - uses: actions/checkout@v4
      - name: Install and first steps as a standard user
        shell: powershell
        run: .\e2e\windows\run-as-standard-user.ps1 -Ref "${{ github.event.pull_request.head.sha || github.sha }}"
