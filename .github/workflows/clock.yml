name: clock
# The quick suites at a fake wall clock (ORCH-390). Three times in one night (17/18 Nov) tests went red only because of
# the hour: the phone chip test in the evening (#1371), the Services view and Sync card tests after midnight UTC
# (#1421); each time develop stayed red for an hour and the merge queue dropped about ten pull requests.
# 22:30 catches "now + a few hours" that crosses midnight; 23:59:40 ticks over midnight in the first seconds, so a
# fixture made "a few minutes ago" lands on yesterday. scripts/at-clock.sh moves only the wall clock (libfaketime).
# ORCH-1118: one cell ran everything in a row (about 15 min, and up to the 30-minute limit when it hung); now each hour
# runs in four parts at the same time, about 5 min each, with a short limit per step.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        at: ["22:30:00", "23:59:40"]
        # parts of about the same length (20 Nov at the fake clock: sync 4.6 min, factory 3.2 + dashboard 1.5,
        # workspace 3.5, the rest 1.5 min plus the page tests)
        part: [sync, factory-dashboard, workspace, rest]
    name: at ${{ matrix.at }} UTC (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: sudo apt-get install -y -qq faketime
      # A real tmux server hangs under libfaketime and held both cells to the 30-minute limit in 9 of 30 groups on
      # 20 Nov (a tmux process was left over each time). No test here needs a live session: a stand-in answers
      # "no" and writes down which test asked, shown at the end of the job.
      - name: tmux stand-in
        run: |
          mkdir -p "$RUNNER_TEMP/notmux"
          printf '#!/bin/sh\necho "${PYTEST_CURRENT_TEST:-?} :: $*" >> "%s/tmux-calls.txt"\nexit 1\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/notmux/tmux"
          chmod +x "$RUNNER_TEMP/notmux/tmux"
          echo "$RUNNER_TEMP/notmux" >> "$GITHUB_PATH"
          sudo rm -f /usr/bin/tmux  # a test that sets its own PATH finds no tmux at all
      - name: Install the add-ons of this part (real clock)
        env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            sync) dirs="workspace-addons/sync/" ;;
            factory-dashboard) dirs="workspace-addons/factory/ workspace-addons/dashboard/" ;;
            workspace) dirs="workspace" ;;
            rest) dirs=$(ls -d workspace-addons/*/ | grep -vE '/(sync|factory|dashboard)/$') ;;
          esac
          echo "DIRS=$(echo $dirs)" >> "$GITHUB_ENV"
          for d in $dirs; do
            [ -f "$d/pyproject.toml" ] && (cd "$d" && uv sync -q && uv pip install -q pytest-timeout)
          done
      - name: Dashboard and master library page tests
        if: matrix.part == 'rest'
        timeout-minutes: 3
        working-directory: workspace-addons/dashboard
        run: ../../scripts/at-clock.sh "${{ matrix.at }}" node --test tests/*.test.js ../../workspace/src/orch_ui/tests/*.test.mjs
      - name: Add-on suites
        if: ${{ !cancelled() && matrix.part != 'workspace' }}
        timeout-minutes: 8
        run: |
          failed=""
          # Left out here only, each for a reason of the fake clock, not of the code (they run in addons.yml):
          # - dashboard test_term.py: a real tmux server hangs under libfaketime (no dates in it)
          # - dashboard test_state_speed.py: measures speed; libfaketime slows every clock call
          # - automation test_recent_runs_short_list_with_titles: a run's length is its log file's time (real, from the
          #   kernel) minus its start (fake), so a fast fail looks like a long good run
          skip="--ignore=tests/test_term.py --ignore=tests/test_state_speed.py"
          skip="$skip --deselect=tests/test_view.py::test_recent_runs_short_list_with_titles"
          for d in $DIRS; do
            [ -d "$d/tests" ] && [ -x "$d/.venv/bin/python" ] || continue
            echo "::group::$d"
            # the same number of workers as the add-on's own job in addons.yml (test order stays as there)
            case "$d" in */dashboard/|*/automation/|*/sync/|*/focus/|*/insights/) n=auto ;; *) n=2 ;; esac
            # --timeout-method=thread: a test stuck where a signal cannot reach it still ends, with every stack shown
            (cd "$d" && PATH="$PWD/.venv/bin:$PATH" ../../scripts/at-clock.sh "${{ matrix.at }}" .venv/bin/python -m pytest -q -n $n -p no:cacheprovider -rfE --timeout 120 --timeout-method=thread $skip) || failed="$failed $d"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "red at ${{ matrix.at }} UTC:$failed"; exit 1; }
      - name: Workspace tests that name a day
        if: ${{ !cancelled() && matrix.part == 'workspace' }}
        timeout-minutes: 8
        working-directory: workspace
        run: |
          files=$(grep -lE "[Tt]oday|[Yy]esterday|[Tt]omorrow|\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\b" tests/test_*.py)
          PATH="$PWD/.venv/bin:$PATH" ../scripts/at-clock.sh "${{ matrix.at }}" .venv/bin/python -m pytest -q -n auto -p no:cacheprovider -rfE --timeout 120 --timeout-method=thread $files
      - name: Which tests asked for tmux
        if: always()
        run: |
          f="$RUNNER_TEMP/tmux-calls.txt"
          [ -s "$f" ] || { echo "no test asked for tmux"; exit 0; }
          { echo "### Tests that asked for tmux at the fake clock"; echo '```'; sort "$f" | uniq -c | sort -rn | head -40; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
