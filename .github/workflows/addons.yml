name: addons
on: workflow_call
jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-addons/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: node --check src/orch_dashboard/web/app.js && node --check src/orch_dashboard/web/blocks.js
      - run: uv run pytest -q
  automation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-addons/automation
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
  focus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-addons/focus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
