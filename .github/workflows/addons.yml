name: addons
on: workflow_call
jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-addons/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: node --check src/orch_dashboard/web/app.js && node --check src/orch_dashboard/web/blocks.js
      - run: node --test tests/*.test.js ../../workspace/src/orch_ui/tests/*.test.mjs
      - run: uv run pytest -q -n auto
  automation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-addons/automation
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -n auto
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-addons/sync
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -n auto
  focus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-addons/focus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -n auto
  tool-name-scan:
    # The cross-tree scan lives in the workspace tests but also reads workspace-addons/,
    # so it must run on add-on-only changes, where the workspace job is skipped.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q tests/test_adapters.py::test_no_tool_names_outside_the_adapter
  py311:
    # The installer's tool Python is 3.11: argparse there is stricter (fb14, `-- <text>` after an optional positional).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd workspace-addons/focus && uv run --python 3.11 pytest -q tests/test_server.py -k "argv or send or control_char"
      - run: cd workspace && uv run --python 3.11 pytest -q tests/test_chat.py -k "say"
  page-smoke:
    # Loads every Focus (and Insights) screen in headless Chromium and fails on a console error, an uncaught exception,
    # a failed request or a missing window global: a page that throws at load must never reach develop.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g playwright@1.64.1
      - run: playwright install --with-deps chromium
      - run: node e2e/focus_insights_smoke.cjs
