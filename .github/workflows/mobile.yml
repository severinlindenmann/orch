name: mobile
on: workflow_call
jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9A-Za-z ]+ \(' | head -1 | sed 's/ ($//')
          echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"
      # Ad hoc signing (not CODE_SIGNING_ALLOWED=NO): an unsigned app has no Keychain in the Simulator.
      # Pull requests into develop: build + unit tests (the UI suite took most of ~18 min per mobile PR). develop/main pushes,
      # PRs into main (releases) and manual runs keep the full suite with the UI tests, so nothing is dropped, only moved to after the merge.
      - name: Build and test
        env:
          SKIP_UI: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && '-skip-testing:OrchMobileUITests' || '' }}
        run: |
          set -o pipefail
          echo "UI tests: ${SKIP_UI:-included}"
          # CI only: a failed UI test gets one more try (-retry-tests-on-failure); the summary step below lists every retry so a flake
          # stays visible. Local runs have no retry, and the long loop test is skipped unless ORCH_UITEST_LONG=1 (not set here).
          rm -rf xcb.xcresult
          xcodebuild test -scheme OrchMobile -destination "platform=iOS Simulator,name=$SIM_NAME" $SKIP_UI \
            -retry-tests-on-failure -test-iterations 2 -resultBundlePath xcb.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual > xcb.log 2>&1 \
            || { grep -E ":[0-9]+:[0-9]+: error:|error: " xcb.log | sort -u | head -60; tail -60 xcb.log; exit 1; }
          tail -60 xcb.log
      - name: List tests that needed a retry
        if: always()
        run: python3 ../scripts/xcresult_retries.py xcb.xcresult >> "$GITHUB_STEP_SUMMARY" || true
