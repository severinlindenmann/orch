name: mobile
on: workflow_call
jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9A-Za-z ]+ \(' | head -1 | sed 's/ ($//')
          echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"
      # Ad hoc signing (not CODE_SIGNING_ALLOWED=NO): an unsigned app has no Keychain in the Simulator.
      # Pull requests: build + unit tests (the UI suite took most of ~18 min per mobile PR). develop/main pushes and
      # manual runs keep the full suite with the UI tests, so nothing is dropped, only moved to after the merge.
      - name: Build and test
        env:
          SKIP_UI: ${{ github.event_name == 'pull_request' && '-skip-testing:OrchMobileUITests' || '' }}
        run: |
          set -o pipefail
          echo "UI tests: ${SKIP_UI:-included}"
          xcodebuild test -scheme OrchMobile -destination "platform=iOS Simulator,name=$SIM_NAME" $SKIP_UI \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual > xcb.log 2>&1 \
            || { grep -E ":[0-9]+:[0-9]+: error:|error: " xcb.log | sort -u | head -60; tail -60 xcb.log; exit 1; }
          tail -60 xcb.log
