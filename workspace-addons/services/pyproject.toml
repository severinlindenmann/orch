[project]
name = "orch-services"
version = "0.1.0"
description = "Keep a workspace's background services running with the computer's own service tool."
requires-python = ">=3.11"
dependencies = []

# Module only: orch finds orch-addon.toml next to it (find_spec) and never imports it.
[project.entry-points."orch.addons"]
services = "orch_services"

[dependency-groups]
# cryptography: the turn-off test runs the real core (orch init, addon add|remove), which needs it
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "jsonschema>=4", "rfc3339-validator", "cryptography>=42"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_services"]

[tool.ruff]
line-length = 110
