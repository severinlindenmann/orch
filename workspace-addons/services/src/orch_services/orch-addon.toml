# Services: background jobs of this workspace, kept running by launchd (macOS), systemd user units (Linux)
# or a Task Scheduler task of the person's own (Windows).
# The computer's service tool does the keeping; the add-on's own background process (orch start) is only the regular
# check: `orch services check` every minute, so a service that keeps stopping raises its one question by itself.
schema = "orch.addon/1"
orch_api = 1
name = "services"
version = "0.1.0"
description = "Keep this workspace's background services running and see their state and log."
docs = "docs.json"                         # its pages on the Documentation page (contracts/docs-pages.md)
run = "orch_services"
skill = "skills/orch-services"
agents_block = "skills/orch-services/AGENTS-block.md"
gitignore = [".orch/addons/services/"]
background = true                          # orch services start|stop|status (no id): the regular check
needs = true                               # orch services needs --json: a failing service work depends on

[dashboard]
label = "Services"
icon = "box"
subtitle = "What keeps running on this computer for this workspace."
