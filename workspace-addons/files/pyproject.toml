[project]
name = "orch-files"
version = "0.1.0"
description = "Browse every file in the workspace by folder and by ticket; find any file by name or by its text."
requires-python = ">=3.11"
dependencies = ["pypdf>=4"]

# Module only: orch finds orch-addon.toml next to it (find_spec) and never imports it.
[project.entry-points."orch.addons"]
files = "orch_files"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "jsonschema>=4", "rfc3339-validator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_files"]

[tool.ruff]
line-length = 110
