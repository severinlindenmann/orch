[project]
name = "orch-personal"
version = "0.1.0"
description = "Your meetings, calendar, messages, mail and notes in one place; helpers use only what you turn on."
requires-python = ">=3.11"
dependencies = []

# Module only: orch finds orch-addon.toml next to it (find_spec) and never imports it.
[project.entry-points."orch.addons"]
personal = "orch_personal"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "jsonschema>=4", "rfc3339-validator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_personal"]

[tool.ruff]
line-length = 110
