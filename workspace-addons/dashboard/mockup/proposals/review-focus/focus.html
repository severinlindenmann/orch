<script>
/* Focused review (ORCH-2178): draft F after the Codex challenge, as a clickable mockup with five teams' data.
   The card is drawn here with the kit's .swipe-* parts: UI.swipeDeck has no place for the "Where were we?" box, the
   check question or the ideas list. Nothing is saved: a reload starts again. */
(()=>{
const TEAMS=window.RF_TEAMS,ORDER=['data','marketing','sales','support','dev'],qs=new URLSearchParams(location.search);
const teamId=TEAMS[qs.get('team')]?qs.get('team'):'data',team=TEAMS[teamId],host=document.getElementById('rf');
/* the twelve kinds in four families, icons as review.js CARD_ICON (pull request 3201) */
const KIND={question:['Question','comment'],choice:['Choice','cards'],before_after:['Before and after','compare'],pictures:['Pictures','image'],document:['Document','file'],changed_words:['Changed words','diff'],numbers:['Numbers','chart'],check_result:['Check result','check'],put_live:['Put it live','link'],run_it:['Run it','code'],try_yourself:['Try it yourself','user'],stuck:['Stuck','pause']};
const LANE={holds:'Holds up work now',press:'Only you can press it',person:'Needs you in person',look:'Look at the result',checked:'Checked by the Reviewer'},LANES=Object.keys(LANE);
const GROUP={quick:{name:'Quick look',mins:.5,say:'Small and tested. One line each.'},short:{name:'Short decision',mins:2,say:'One clear question each.'},time:{name:'Take your time',mins:6,say:'Big, public or hard to take back.'}};
const MAX=5,S={view:'start',project:'',group:'',run:[],ans:{},later:{},moved:{},ideas:{},checks:{},flash:null,showChecked:false,practice:false,panel:null,ran:{},pins:{},offset:0,where:{},fixed:{},reveal:null,fail:null,said:''};
const h=(tag,cls,...kids)=>{const n=document.createElement(tag);if(cls)n.className=cls;kids.flat().forEach(k=>{if(k!=null&&k!==false&&k!=='')n.append(k)});return n};
const ic=(name,z)=>{const t=document.createElement('template');t.innerHTML=window.icon?window.icon(name,z||16):'';return t.content};
const btn=(cls,label,fn)=>{const b=h('button',cls,label);b.type='button';if(fn)b.onclick=fn;return b};
const mock=what=>UI.toast('Mockup: '+what);
const byId=id=>team.cards.find(c=>c.id===id);
const groupOf=c=>S.moved[c.id]?'time':c.group;
const isOpen=c=>!S.ans[c.id]&&!S.later[c.id];
const inProject=c=>!S.project||c.project===S.project;
const laneOf=c=>c.holds?'holds':c.lane;
const waiting=g=>team.cards.filter(c=>isOpen(c)&&inProject(c)&&(!g||groupOf(c)===g));
/* inside a group the five lanes give the order (Holds up work now first); cards of one project stay together */
const ordered=list=>{const rank=c=>LANES.indexOf(laneOf(c)),best={};list.forEach(c=>{best[c.project]=Math.min(best[c.project]??9,rank(c))});
 return list.slice().sort((a,b)=>best[a.project]-best[b.project]||team.projects.indexOf(a.project)-team.projects.indexOf(b.project)||rank(a)-rank(b))};
const about=list=>'about '+Math.max(1,Math.round(list.reduce((n,c)=>n+GROUP[groupOf(c)].mins,0)))+' min';
const urgency=c=>{const d=c.deadline||'';return d==='now'?0:/^today \d/.test(d)?1:d==='today'?2:/^tomorrow \d/.test(d)?3:d==='tomorrow'?4:d?5:9};
const short=t=>t.length>48?t.slice(0,46)+'…':t;

/* ---- moves: every one can be undone; the Undo line has its own reserved row and stays 6 s ---- */
const STATE=qs.get('state')||'',phone=()=>matchMedia('(max-width:720px)').matches,calmMotion=()=>!window.orch||orch.reduce();
const liveEl=document.getElementById('rf-live');let sayT=0;
const say=t=>{clearTimeout(sayT);liveEl.textContent='';sayT=setTimeout(()=>{liveEl.textContent=t},40)};
let flashT=0;
const flash=(text,ids,o)=>{S.flash=Object.assign({text,ids:[].concat(ids),fresh:true},o||{});S.said='Answered: '+text+(S.flash.fixed?' · This cannot be undone.':' · Undo with U.');clearTimeout(flashT);
 flashT=setTimeout(()=>{S.flash=null;const l=host.querySelector('.rf-undo-in');if(!l)return;if(calmMotion()){l.remove();return}l.classList.add('rf-fade-out');setTimeout(()=>l.remove(),140)},6000)};
const openRun=()=>S.run.map(byId).filter(c=>isOpen(c)&&groupOf(c)===S.group);
const now=()=>{const o=openRun();S.offset=Math.max(0,Math.min(S.offset||0,o.length-1));return o[S.offset]};
const undo=ids=>{ids=[].concat(ids).filter(id=>!(S.ans[id]&&S.ans[id].fixed));if(!ids.length)return;ids.forEach(id=>{delete S.ans[id];delete S.later[id];delete S.moved[id];delete S.checks[id];delete S.ran[id]});S.flash=null;clearTimeout(flashT);
 const c=byId(ids[0]);if(S.batch){S.batch=null;S.view='quick'}else if(S.run.includes(c.id)){S.group=groupOf(c);S.view='run';S.offset=Math.max(0,openRun().indexOf(c))}S.said='Taken back: '+c.title+'.';draw()};
const next=()=>{if(S.view==='run'&&!openRun().length)S.view='done';draw()};
/* ?state=savefail: the first answer does not save; the card stays and the bar offers Try again */
const answer=(c,label,o)=>{if(STATE==='savefail'&&!S.savedOnce){S.fail={id:c.id,label,o};S.said='Not saved: '+label+'. Try again.';draw();return}S.fail=null;S.ans[c.id]=Object.assign({label},o||{});flash(label+': '+short(c.title),c.id,o);next()};
const later=(c,when)=>{S.later[c.id]=when||'no reminder';flash((when?'Later, '+when:'Later')+': '+short(c.title),c.id);next()};
const moreTime=c=>{S.moved[c.id]=true;flash('Moved to Take your time: '+short(c.title),c.id);next()};
const step=n=>{const o=openRun();if(o.length<2)return;S.offset=((S.offset||0)+n+o.length)%o.length;draw()};
const startRun=(g,first)=>{let list=ordered(waiting(g));if(first){const same=list.filter(c=>c.project===first.project&&c!==first);list=[first,...same,...list.filter(c=>c.project!==first.project)]}
 S.group=g;S.batch=null;S.offset=0;S.run=list.slice(0,MAX).map(c=>c.id);S.view=S.run.length?'run':'start';S.flash=null;draw()};

/* ---- small parts ---- */
const rows=list=>{const dl=h('dl','facts rf-rows');list.forEach(([k,v])=>dl.append(h('dt','',k),h('dd','',v)));return dl};
const kindChip=c=>h('span','swipe-kind',ic(KIND[c.kind][1],14),KIND[c.kind][0]);
const undoLine=()=>{const l=h('div','rf-undo');if(!S.flash)return l;const f=S.flash,inn=h('div','rf-undo-in'+(f.fresh?' rf-fade':''),h('span','',f.text));f.fresh=false;
 if(f.fixed)inn.append(h('span','meta','This cannot be undone'));else{const u=btn('btn ghost sm',[ic('undo',16),'Undo',h('kbd','rf-kbd','U')],()=>undo(f.ids));inn.append(u)}l.append(inn);return l};
const mockBar=()=>{const seg=h('nav','segmented');seg.setAttribute('aria-label','Mockup: pick a team');
 ORDER.forEach(id=>{const a=h('a','btn sm',TEAMS[id].label);a.href='?team='+id+(STATE?'&state='+STATE:'');a.setAttribute('aria-pressed',String(id===teamId));seg.append(a)});
 const st=h('nav','segmented rf-mock-wide');st.setAttribute('aria-label','Mockup: show a state');[['','Normal'],['loading','Loading'],['empty','Nothing waits'],['savefail','Save fails'],['panelfail','Panel fails']].forEach(([k,w])=>{const a=h('a','btn sm',w);a.href='?team='+teamId+(k?'&state='+k:'');a.setAttribute('aria-pressed',String(k===STATE));st.append(a)});
 return h('div','rf-mock',h('span','rf-mock-label','Mockup: pick a team'),seg,h('span','rf-mock-label rf-mock-wide','State'),st,h('span','meta rf-mock-wide',team.who+' · '+team.company))};

/* ---- the deciding fact, by kind ---- */
function fact(c){const f=c.fact,box=h('section','rf-fact');box.setAttribute('aria-label','What matters');
 if(f.summary)box.append(h('p','rf-flabel','The helper says'),h('h4','rf-sum',f.summary));else box.append(h('p','rf-flabel','What matters'));
 if(f.type==='big')box.append(h('p','rf-big',h('strong','',f.big),' '+f.label+', not ',h('strong','',f.vs),' '+f.vsLabel),h('p','',f.note));
 if(f.type==='ba')box.append(h('div','rf-pics two',h('figure','',pic(f.before),h('figcaption','meta','Before')),h('figure','',pic(f.after),h('figcaption','meta','After'))),h('div','row',bigger(c,[f.before,f.after],0,true)));
 if(f.type==='pics')box.append(h('div','rf-pics',f.pics.map((p,i)=>{const b=btn('rf-pic-btn',pic(p),e=>zoom(c,f.pics,i,false,e.currentTarget));b.setAttribute('aria-label','Make bigger: '+p.head+', '+p.sub);return h('figure','',b,h('figcaption','meta',p.sub))})),h('div','row',bigger(c,f.pics,0)));
 if(f.type==='words')box.append(h('p','meta muted',f.where),h('div','rf-words',h('p','',h('span','meta','Before'),h('del','',f.before)),h('p','',h('span','meta','After'),h('ins','',f.after))),f.more&&h('p','',f.more));
 if(f.type==='conflict'){const b=h('div','banner slim error',h('strong','',f.text));b.setAttribute('role','alert');box.append(b)}
 if(f.type==='cmd')box.append(UI.commandCopy(f.command));
 if(f.type==='doc'){f.paras.forEach(p=>box.append(h('p','',p)));box.append(h('div','row',btn('btn outline sm',[ic('file',16),'Open the document'],()=>openPanel(c,'ticket',{file:'doc'}))))}
 if(f.type==='nums'){const t=h('table','mini-table rf-nums'),hr=h('tr');f.cols.forEach(x=>hr.append(h('th','',x)));t.append(h('thead','',hr));const tb=h('tbody');f.rows.forEach(r=>tb.append(h('tr','',r.map(x=>h('td','',x)))));t.append(tb);box.append(t)}
 if(f.rows&&f.type!=='nums')box.append(rows(f.rows));
 if(f.type==='options'||f.type==='optpics'){const ol=h('div','rf-options'+(f.type==='optpics'?' pics':''));f.options.forEach((o,i)=>ol.append(h('div','rf-option',o.pic&&pic(o.pic),h('p','',h('span','opt-letter','ABC'[i]),h('strong','',o.t)),h('p','meta muted',o.n))));box.append(ol);if(f.type==='optpics')box.append(h('div','row',bigger(c,f.options.map((o,i)=>Object.assign({cap:'ABC'[i]+': '+o.t},o.pic)),0)))}
 if(f.type==='ideas')box.append(ideas(c));
 if(f.link)box.append(btn('btn outline sm',[ic('external',16),f.link],()=>mock('this opens what you try yourself')));
 if(f.open){const [a,...b]=f.open.split(': ');box.append(h('div','banner slim attn',h('p','',h('strong','',a+': '),b.join(': '))))}
 return box}

/* ideas (draft D): a 3-point brief, then Keep / Later / No per idea; saving part of them is fine. Save sits in the answer bar. */
function ideas(c){const f=c.fact,pick=S.ideas[c.id]=S.ideas[c.id]||{},wrap=h('div','rf-ideas'),ol=h('ol','rf-brief');f.brief.forEach(b=>ol.append(h('li','',b)));wrap.append(ol);
 f.items.forEach((it,i)=>{const seg=h('div','segmented');seg.setAttribute('role','group');seg.setAttribute('aria-label',it.t);
  ['Keep','Later','No'].forEach(w=>{const b=btn('btn sm',w,()=>{if(pick[i]===w)delete pick[i];else pick[i]=w;seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(pick[i]===x.textContent)));refreshBar(c)});b.setAttribute('aria-pressed',String(pick[i]===w));b.setAttribute('aria-label',w+': '+it.t);seg.append(b)});
  wrap.append(h('div','rf-idea',h('div','grow',h('strong','',it.t),h('p','meta muted',it.n)),seg))});
 wrap.append(h('p','meta','Ideas you do not sort stay here for later.'));return wrap}

/* ---- the answers: the kit's sticky bar under the card (above the tab bar on a phone); everything else is under More ---- */
const answersOf=c=>{let list=c.answers||c.fact.options.map((o,i)=>({label:'Use '+'ABC'[i],full:'Use '+'ABC'[i]+': '+o.t,sug:c.sug===i})).concat([{label:'None of these',v:'no'}]);return c.kind==='stuck'?list.filter(a=>a.label!=='Open the ticket'):list};
const closeMore=()=>{const m=host.querySelector('.rf-more[open]');if(m)m.open=false;document.querySelectorAll('dialog.rf-sheet[open]').forEach(d=>d.close())};
const sheet=(title,content)=>{const d=h('dialog','sheet rf-sheet',h('div','sheet-h',h('h2','',title)),content);d.setAttribute('aria-label',title);d.addEventListener('close',()=>d.remove());document.body.append(d);if(window.orch)orch.open(d);else d.showModal();return d};
function sendBack(c){closeMore();const ta=h('textarea','input rf-note');ta.rows=3;ta.placeholder='What should change?';ta.setAttribute('aria-label','Your comment for the helper');
 const go=l=>{d.close();answer(c,l)},back=btn('btn primary','Send back',()=>go(ta.value.trim()?'Sent back with your comment':'Sent back'));ta.oninput=()=>{back.textContent=ta.value.trim()?'Send back with your comment':'Send back'};
 const reasons=h('div','row');['Not what I asked','Explain it shorter','Show me more first'].forEach(r=>reasons.append(btn('chip-btn',r,()=>go('Sent back: '+r.toLowerCase()))));
 const d=sheet('Send back',h('div','stack',h('p','meta muted',c.decide),ta,h('div','row',back),h('p','meta','Or one tap:'),reasons));setTimeout(()=>ta.focus(),0)}
function laterSheet(c){closeMore();const go=w=>{d.close();later(c,w)},chips=h('div','row');['this afternoon','tomorrow','when '+c.ticket+' is done'].forEach(w=>chips.append(btn('chip-btn',w,()=>go(w))));
 const d=sheet('Later',h('div','stack',h('p','meta muted',c.decide),h('div','row',btn('btn primary','Later, no reminder',()=>go(''))),h('p','meta','Remind me:'),chips))}
function moreItems(c){const g=groupOf(c),it=(icon,label,fn)=>{const b=btn('menu-item',[ic(icon,16),label],()=>{closeMore();fn()});b.setAttribute('role','menuitem');return b};
 const out=[h('p','meta rf-more-why','In '+GROUP[g].name+': '+(S.moved[c.id]?'you asked for more time':c.why)+'.'),it('undo','Send back…',()=>sendBack(c)),it('clock','Later…',()=>laterSheet(c)),it('comment','Ask about this',()=>openPanel(c,'chat',{draft:'About: '+c.decide}))];
 if(c.kind!=='stuck')out.push(it('code','Open the session',()=>openPanel(c,'term')));out.push(it('ticket','Open the ticket',()=>openPanel(c,'ticket')));
 if(g!=='time')out.push(it('expand','Needs more time',()=>moreTime(c)));return out}
function more(c){if(phone()){const b=btn('btn ghost rf-more-btn','More',()=>sheet('More',h('div','rf-more-list',moreItems(c))));return b}
 const d=h('details','dropdown rf-more'),s=h('summary','btn ghost rf-more-btn','More',h('kbd','rf-kbd','M'));s.setAttribute('aria-haspopup','menu');const m=h('div','menu',moreItems(c));m.setAttribute('role','menu');d.append(s,m);return d}
