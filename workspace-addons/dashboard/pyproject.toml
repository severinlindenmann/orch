[project]
name = "orch-dashboard"
version = "0.2.0"
description = "orch dashboard add-on: read-only web view of the workspace tickets and add-on tabs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orch-dashboard = "orch_dashboard.cli:main"

# The orch CLI finds the manifest (orch-addon.toml) of this module without importing it.
[project.entry-points."orch.addons"]
dashboard = "orch_dashboard"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "jsonschema>=4.20", "rfc3339-validator>=0.1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_dashboard"]

[tool.ruff]
line-length = 110
