[project]
name = "orch-dashboard"
version = "0.1.0"
description = "orch dashboard add-on: read-only web view of the workspace tickets"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orch-dashboard = "orch_dashboard.cli:main"

# The orch CLI discovers add-on commands in this group: `orch dashboard ...` calls main(argv).
[project.entry-points."orch.addons"]
dashboard = "orch_dashboard.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_dashboard"]

[tool.ruff]
line-length = 110
