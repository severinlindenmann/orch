<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>orch · Dashboard</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/components.css">
<link rel="stylesheet" href="kit/motion.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages/home.css">

<link rel="stylesheet" href="pages/ticket.css">
<link rel="stylesheet" href="pages/newticket.css">

<body class="has-shell">
<div class="shell">
<aside class="sidebar">
<div class="sidebar-top">
<a class="brand" href="#home" aria-label="orch dashboard"><img src="logo.svg" alt="">orch</a>
<button type="button" class="btn ghost mobile-menu" id="menu-toggle" aria-expanded="false" aria-controls="side-nav">Menu</button>
</div>
<div class="workspace"><span id="workspace-name">Workspace</span><p class="meta">Workspace</p></div>
<nav id="side-nav" aria-label="Main"></nav>
<nav id="side-settings" class="side-settings" aria-label="Settings"></nav>
<div class="side-foot"><p class="meta" id="workspace-mode"></p></div>
</aside>
<div>
<div id="mm-bar" class="mm-bar" hidden></div>
<header class="topbar"><span id="crumb">Home</span><button type="button" class="mm-toggle" id="mm-toggle" role="switch" aria-checked="false" data-testid="mobile-mode-toggle" hidden><i class="mm-sw"></i>Mobile mode</button><button type="button" class="btn outline sm" id="open-agent" data-action="open-agent" hidden>Open agent</button><button type="button" class="btn primary sm" id="new-ticket" hidden>New ticket</button></header>
<div id="connection" class="banner attn" role="status" hidden></div>
<main id="content" class="page" aria-label="Dashboard"><div class="loading-home" role="status" aria-busy="true" aria-label="Loading"><div class="skeleton lh-title"></div><div class="skeleton lh-card"></div><div class="skeleton lh-card"></div></div></main>
</div>
</div>
<script src="kit/icons.js"></script>
<script src="kit/motion.js"></script>
<script src="kit/question-card-state.js"></script>
<script src="kit/question-card.js"></script>

<script src="blocks.js"></script>
<script src="mobile-mode.js"></script>
<script src="look-icons.js"></script>
<script src="look.js"></script>
<script src="switcher.js"></script>
<script src="pages/home.js"></script>
<script src="pages/tickets.js"></script>
<script src="pages/ticket.js"></script>
<script src="pages/newticket.js"></script>
<script src="pages/settings.js"></script>
<script src="pages/chat.js"></script>
<script src="app.js"></script>
</body>
</html>
