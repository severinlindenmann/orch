# Skills: everything helpers get in this workspace (skills, instruction files, connected services, logins) and
# Turn off / Turn on for this workspace only. Its page is served by its background process. Preview (ORCH-834).
schema = "orch.addon/1"
orch_api = 1
name = "skills"
version = "0.1.0"
description = "Everything your helpers get here: skills, instructions, connected services and logins, and what is turned off."
run = "orch_skills"
skill = "skills/orch-skills"
agents_block = "skills/orch-skills/AGENTS-block.md"
gitignore = [".orch/addons/skills/", ".orch/skills-off.json", ".orch/skills-removed.json"]
background = true

[dashboard]
label = "Skills"
icon = "list"
order = 32

[page]
path = "/"
label = "Open Skills"

# The page's clicks (the dashboard runs them as the person): `orch skills act <verb> --by X --json -- <item id>`.
[acts.on]
summary = "Turn one skill, rules file or connected service on again in this workspace"
who = "people"

[acts.off]
summary = "Turn one skill, rules file or connected service off in this workspace"
who = "people"

[acts.remove]
summary = "Remove a shared skill from this workspace; relay updates skip it"
who = "people"

[acts.restore]
summary = "Bring a removed shared skill back"
who = "people"

[acts.check]
summary = "Ask Claude which connected services need a sign-in"
who = "people"
