[project]
name = "orch-skills"
version = "0.1.0"
description = "Skills: everything your helpers get in this workspace (skills, instructions, connected services, logins), with turn off and on."
requires-python = ">=3.11"
dependencies = []

# Module only: orch finds orch-addon.toml next to it (find_spec) and never imports it.
[project.entry-points."orch.addons"]
skills = "orch_skills"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "cryptography>=42", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_skills"]

[tool.ruff]
line-length = 120
