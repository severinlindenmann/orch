[project]
name = "orch-insights"
version = "0.1.0"
description = "See what your agents used in the last 30 days."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.entry-points."orch.addons"]
insights = "orch_insights"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_insights"]

[tool.ruff]
line-length = 110
