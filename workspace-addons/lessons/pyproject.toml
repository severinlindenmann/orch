[project]
name = "orch-lessons"
version = "0.1.0"
description = "Helpers remember what they learned in this workspace; you see, edit or delete it in one list."
requires-python = ">=3.11"
dependencies = []

# Module only: orch finds orch-addon.toml next to it (find_spec) and never imports it.
[project.entry-points."orch.addons"]
lessons = "orch_lessons"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "jsonschema>=4", "rfc3339-validator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_lessons"]

[tool.ruff]
line-length = 110
