[project]
name = "orch-focus"
version = "0.0.1"
description = "orch focus add-on (placeholder, built in wave 2)"
requires-python = ">=3.11"
dependencies = []

# Module only: orch finds orch-addon.toml next to it (find_spec) and never imports it.
[project.entry-points."orch.addons"]
focus = "orch_focus"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_focus"]

[tool.pytest.ini_options]
markers = ["slow: takes more than 2 s"]

[tool.ruff]
line-length = 110
