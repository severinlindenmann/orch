# workspace-addons/focus/src/orch_focus/orch-addon.toml
schema = "orch.addon/1"
orch_api = 1
name = "focus"
version = "0.1.0"
recommended = true                          # orch init --recommended turns it on
description = "Every helper session live: watch them work, answer their questions, send them a message."
run = "orch_focus"                          # orch focus open|needs  ->  python -m orch_focus <args>
skill = "skills/orch-focus"
agents_block = "skills/orch-focus/AGENTS-block.md"
needs = true                                # orch focus needs --json

[dashboard]
label = "Focus"
icon = "target"
order = 20

# The dashboard draws Focus at this add-on's addresses (#addon/focus[/t/<ticket>]); no server of its own.
[page]
path = "/"
label = "Open Focus"
live_session = true
