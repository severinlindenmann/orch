# Pull requests: the merge queue (ORCH-168, first part of the GitHub plan ORCH-146). CLI only for now, no page,
# no background service: `queue add` starts the runner, which ends when the queue is empty.
schema = "orch.addon/1"
orch_api = 1
name = "pull-requests"
version = "0.1.1"
description = "Merge queue: pull requests wait in line and are merged in groups after one run of the checks."
run = "orch_pull_requests"
skill = "skills/orch-pull-requests"
agents_block = "skills/orch-pull-requests/AGENTS-block.md"
gitignore = [".orch/addons/pull-requests/"]
