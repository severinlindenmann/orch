[project]
name = "orch-factory"
version = "0.1.0"
description = "Turn an idea into finished work."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4", "rfc3339-validator"]

[project.scripts]
orch-factory = "orch_factory.cli:main"

[project.entry-points."orch.addons"]
factory = "orch_factory"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_factory"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
markers = ["slow: integration with the real core"]
