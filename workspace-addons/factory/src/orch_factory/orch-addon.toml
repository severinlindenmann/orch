schema = "orch.addon/1"
orch_api = 1
name = "factory"
version = "0.1.0"
description = "Turn an idea into finished work: your helper proposes the run, you press Start."
run = "orch_factory"
skill = "skills/orch-factory"
agents_block = "skills/orch-factory/AGENTS-block.md"
ticket_ext = "ext.schema.json"
needs = true
background = true                          # `orch factory start|stop|status`: the watcher that wakes the manager
runs_agents = true                         # it starts the manager run (orch run start) when you answer
checks_own_stop = true                     # `stop <order> --file` is a stop review; only the watcher stop is guarded (cli.py)

[page]
path = "/"
label = "Open Projects"

[dashboard]
label = "Projects"
icon = "hammer"
order = 15

[[ticket_view]]
field = "stage"
label = "Factory stage"
format = "text"

[[ticket_view]]
field = "eta"
label = "Ready around"
format = "time"

[acts.idea]
summary = "File the idea box's text as a new order and start your agent on its first draft"
who = "people"
writes = ["ext.factory"]

[acts.ask]
summary = "Ask another workspace for its view on a stop, with the items you picked"
who = "people"
writes = ["ext.factory"]

[acts.start]
summary = "Ask again to start an order saved for later (you press Start)"
who = "people"
writes = ["ext.factory"]

[[selfcheck]]                              # after every update: the Factory list still opens
label = "Factory list"
fails = "the Factory list does not open"
args = ["list", "--json"]
