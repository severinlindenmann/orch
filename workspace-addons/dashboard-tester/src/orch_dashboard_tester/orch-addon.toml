# Dashboard tester: one look at every dashboard page a day, through an automation repeat. No tab, no background.
schema = "orch.addon/1"
orch_api = 1
name = "dashboard-tester"
version = "0.1.0"
description = "Looks at every dashboard page once a day and reports what is broken, without clicking anything."
docs = "docs.json"                         # its pages on the Documentation page (contracts/docs-pages.md)
run = "orch_dashboard_tester"
skill = "skills/orch-dashboard-tester"
agents_block = "skills/orch-dashboard-tester/AGENTS-block.md"
requires = ["dashboard", "automation"]
runs_agents = true                          # only with --helper-each-release, through orch run start
gitignore = [".orch/addons/dashboard-tester/"]
