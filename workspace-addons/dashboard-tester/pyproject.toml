# Placeholder, no add-on (ORCH-1369). The dashboard-tester add-on was removed from orch (#1772). An orch
# release that still shipped it reinstalls every add-on on its computer's list during `orch update`, and that
# old code asks for this folder: without it uv failed and the update was refused. This empty package lets
# that install finish; the new orch then takes dashboard-tester off the list ("Add-on dashboard-tester
# removed: it no longer ships with orch."). No src/, no orch-addon.toml, no entry point: orch never finds or
# offers it. Delete this folder once no supported release ships dashboard-tester
# (workspace/tests/test_addons_upgrade.py REMOVED_ADDONS).
[project]
name = "orch-dashboard-tester"
version = "0.0.0"
description = "Placeholder: the dashboard-tester add-on was removed from orch."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml"]
