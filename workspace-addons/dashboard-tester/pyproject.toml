[project]
name = "orch-dashboard-tester"
version = "0.1.0"
description = "Looks at every dashboard page once a day and reports what is broken, without clicking anything."
requires-python = ">=3.11"
dependencies = ["playwright>=1.49"]

# Module only: orch finds orch-addon.toml next to it (find_spec) and never imports it.
[project.entry-points."orch.addons"]
dashboard-tester = "orch_dashboard_tester"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_dashboard_tester"]

[tool.ruff]
line-length = 110
