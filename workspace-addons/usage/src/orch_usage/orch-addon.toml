# Usage: accounts, limits, order, history and early switching (background loop) and its page (served by the loop).
schema = "orch.addon/1"
orch_api = 1
name = "usage"
version = "0.1.0"
description = "Every account the helpers spend on, its limits, its order and a history of every change."
docs = "docs.json"                         # its pages on the Documentation page (contracts/docs-pages.md)
run = "orch_usage"
skill = "skills/orch-usage"
agents_block = "skills/orch-usage/AGENTS-block.md"
gitignore = [".orch/addons/usage/"]
background = true
before_start = true
needs = true                                # orch usage needs --json: the warnings, once each; which rule wins

[dashboard]
label = "Usage"
icon = "bolt"
order = 35

[page]
path = "/"
label = "Open Usage"

# The page's clicks (the dashboard runs them as the person): `orch usage act <verb> --by X --json -- <target>`.
[acts.limit]
summary = "Set or remove one limit of an account"
who = "people"

[acts.period]
summary = "Change what a limit counts over: 5 hours, a week, a month or until a date"
who = "people"

[acts.order]
summary = "Use an account earlier or later"
who = "people"

[acts.on]
summary = "Use an account again"
who = "people"

[acts.off]
summary = "Stop using an account"
who = "people"

[acts.end]
summary = "End an account's rule on a date, then go back to the rule before it"
who = "people"

[acts.for]
summary = "Say which kinds of work may use an account"
who = "people"

[acts.model]
summary = "Say which model the kinds of work on an account may use"
who = "people"

[acts.together]
summary = "Set one money limit over every account of a provider"
who = "people"

[acts.add]
summary = "Add an API credit or helper tool"
who = "people"

[acts.remove]
summary = "Take an API credit or helper tool off the list"
who = "people"

[acts.left]
summary = "Say what is left on an API credit now, as read at the provider"
who = "people"

[acts.restore]
summary = "Bring back an API credit or helper tool that was removed"
who = "people"

[acts.switching]
summary = "Switch accounts by itself, or only show and warn"
who = "people"

[acts.switcher]
summary = "Follow the workspace that switches the accounts, or switch from here"
who = "people"

[acts.seen]
summary = "Got it: hide a Usage warning until it clears and comes back"
who = "people"

[acts.share]
summary = "Change how helper work is spread over subscriptions, API credit and helper tools"
who = "people"
