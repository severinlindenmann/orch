[project]
name = "orch-usage"
version = "0.1.0"
description = "Usage: every account the helpers spend on, its limits, its order and a history of every change."
requires-python = ">=3.11"
dependencies = []

# Module only: orch finds orch-addon.toml next to it (find_spec) and never imports it.
[project.entry-points."orch.addons"]
usage = "orch_usage"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_usage"]

[tool.ruff]
line-length = 110
