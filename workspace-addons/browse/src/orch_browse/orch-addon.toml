# Browser (ORCH-1492, first step of the ORCH-1112 plan, owner pick A on ORCH-1158): read public pages in a
# private browser per ticket, behind orch's network filter. Off and invisible until turned on.
schema = "orch.addon/1"
orch_api = 1
name = "browse"
version = "0.1.0"
recommended = false
description = "Helpers read public web pages in a private browser per ticket; only sites you allow open."
run = "orch_browse"
skill = "skills/orch-browse"
agents_block = "skills/orch-browse/AGENTS-block.md"
gitignore = [".orch/addons/browse/"]

# The Browser page in the dashboard (ORCH-1494): every helper's browser, live, drawn by the dashboard itself
# (panel "browser"); `orch browse view --json` only answers the tab's empty view.
[dashboard]
label = "Browser"
icon = "globe"
order = 45
panel = "browser"
subtitle = "Each ticket that needs the web gets its own fresh browser, closed when the work is done."
