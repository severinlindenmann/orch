[project]
name = "orch-browse"
version = "0.1.0"
description = "A private, read-only browser per ticket behind orch's network filter."
requires-python = ">=3.11"
# One pinned Playwright and the Chromium it ships (wall note section 8): an update is its own pull request
# that runs the wall tests again.
dependencies = ["playwright==1.64.1"]

# Module only: orch finds orch-addon.toml next to it (find_spec) and never imports it.
[project.entry-points."orch.addons"]
browse = "orch_browse"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_browse"]

[tool.ruff]
line-length = 110
