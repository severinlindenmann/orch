<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weekly report</title>
  <style>
    body{margin:0;padding:24px;font:14px/1.5 system-ui,sans-serif;color:#1a1d23;background:#fff}
    h1{font-size:22px;margin:4px 0 8px} .muted{color:#667}
    .m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
    .m div{background:#f1f3f6;border-radius:8px;padding:12px} .m b{display:block;font-size:22px}
  </style>
</head>
<body >
  <p class="muted">To: team leads · Week 44</p>
  <h1>A good week, in numbers.</h1>
  <p>Revenue is up and fewer invoices are overdue. The October export is ready to review.</p>
  <div class="m">
    <div><span class="muted">Revenue CHF</span><b>48’200</b></div>
    <div><span class="muted">New customers</span><b>7</b></div>
    <div><span class="muted">Overdue</span><b>3</b></div>
  </div>
  <p class="muted">Prepared for the weekly report. Have a good weekend.</p>
</body>
</html>
