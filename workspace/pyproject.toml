[project]
name = "orch-workspace"
version = "0.1.0"
description = "orch: tickets with evidence, skills and add-ons for any agent tool"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = []

[project.scripts]
orch = "orch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "orch/skills"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4", "rfc3339-validator"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
