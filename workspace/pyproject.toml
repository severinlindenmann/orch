[project]
name = "orch-workspace"
version = "0.1.0"
description = "orch: tickets with evidence, skills and add-ons for any agent tool"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = ["cryptography>=42", "jsonschema>=4", "truststore>=0.10; sys_platform == 'win32'"]

[project.scripts]
orch = "orch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch", "src/orch_ui"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "orch/skills"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "jsonschema>=4", "rfc3339-validator"]

[tool.ruff]
extend-exclude = ["src/orch/templates"]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: starts a local server",
    "real_start_guard: keep the real adapters.check_start_folder (see conftest)",
    "copies_locked: checks the copies lock itself (not lifted by the test fixture)",
]
