[package]
name = "orch-transcription"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "orch_transcription"
path = "src/lib.rs"

[[bin]]
name = "orch-transcription"
path = "src/main.rs"

[features]
default = ["whisper"]
# The real speech engine (whisper.cpp, built from source with cmake). Off = only the fake engine (fast tests).
whisper = ["dep:whisper-rs"]
# Apple graphics chip for the host Mac.
metal = ["whisper", "whisper-rs/metal"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4", "wav", "pcm", "mkv", "ogg", "vorbis", "flac", "mp3"] }
symphonia-adapter-libopus = "0.3"
whisper-rs = { version = "0.16", optional = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
